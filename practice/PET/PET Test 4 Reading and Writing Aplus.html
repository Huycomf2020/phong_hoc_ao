<body>
<div id="root"></div>

<script>
/* ============================ CONSTANTS & KEYS ============================ */
const SKILL_ORDER = ['reading', 'writing'];
const INITIAL_TIMES = { reading: 50 * 60, writing: 40 * 60 }; 

const READING_CORRECT_ANSWERS = {
    'r_q1': 'B', 'r_q2': 'C', 'r_q3': 'A', 'r_q4': 'C', 'r_q5': 'B',
    'r_q6': 'D', 'r_q7': 'F', 'r_q8': 'H', 'r_q9': 'A', 'r_q10': 'E',
    'r_q11': 'A', 'r_q12': 'B', 'r_q13': 'B', 'r_q14': 'B', 'r_q15': 'A',
    'r_q16': 'B', 'r_q17': 'A', 'r_q18': 'B', 'r_q19': 'B', 'r_q20': 'A',
    'r_q21': 'C', 'r_q22': 'B', 'r_q23': 'C', 'r_q24': 'A', 'r_q25': 'B',
    'r_q26': 'A', 'r_q27': 'C', 'r_q28': 'D', 'r_q29': 'B', 'r_q30': 'C',
    'r_q31': 'B', 'r_q32': 'C', 'r_q33': 'A', 'r_q34': 'B', 'r_q35': 'A'
};

const WRITING_CORRECT_ANSWERS = {
    'w_q1': ['is'],
    'w_q2': ['cheaper', 'less expensive', 'cheaper / less expensive'],
    'w_q3': ['without'],
    'w_q4': ['have', 'keep', 'own', 'have any', 'keep any', 'own any'],
    'w_q5': ['opened', 'was opened']
};

const TOTAL_READING_QUESTIONS = Object.keys(READING_CORRECT_ANSWERS).length;
const TOTAL_WRITING_P1_QUESTIONS = Object.keys(WRITING_CORRECT_ANSWERS).length;

const INITIAL_CANDIDATE_STATE = {
    code: '',
    name: '',
    apiKey: '',
    currentSkill: 'reading',
    answers: { reading: {}, writing: {} },
    times: { ...INITIAL_TIMES },
    timerRunning: false,
    warningCount: 0
};

/* ============================ STATE MANAGEMENT ============================ */
let appState = 'setup'; 
let candidate = JSON.parse(JSON.stringify(INITIAL_CANDIDATE_STATE));
let isEndModalOpen = false;
let isReportModalOpen = false;
let isWarningModalOpen = false;
let warningMessage = '';
let timerInterval = null;
let aiEvaluationResult = null;
let isEvaluatingAI = false;

const root = document.getElementById('root');

/* ============================ SECURITY LISTENERS ============================ */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
    }
});

document.addEventListener('keydown', e => {
    if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && e.key === 'I') ||
        (e.ctrlKey && e.shiftKey && e.key === 'J') ||
        (e.ctrlKey && e.key === 'u') ||
        (e.ctrlKey && e.key === 'c') ||
        (e.ctrlKey && e.key === 's') ||
        (e.ctrlKey && e.key === 'p')
    ) {
        e.preventDefault();
    }
});

window.addEventListener('visibilitychange', () => {
    if (document.hidden && appState === 'testing' && !isReportModalOpen) {
        triggerWarning('CẢNH BÁO VI PHẠM: Bạn đã chuyển tab hoặc rời khỏi giao diện bài thi!');
    }
});

document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && appState === 'testing' && !isReportModalOpen) {
        triggerWarning('CẢNH BÁO VI PHẠM: Bạn đã thoát chế độ Toàn màn hình!');
    }
});

function triggerWarning(msg) {
    candidate.warningCount += 1;
    warningMessage = msg;
    isWarningModalOpen = true;
    saveState();
    render();
}

function dismissWarning() {
    isWarningModalOpen = false;
    const elem = document.documentElement;
    if (!document.fullscreenElement && elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
    }
    render();
}

/* ============================ TIMER & HELPERS ============================ */
function formatTime(seconds) {
    const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
}

function getAnsweredCount(skill) {
    const answers = candidate.answers[skill] || {};
    const correctTable = skill === 'reading' ? READING_CORRECT_ANSWERS : WRITING_CORRECT_ANSWERS;
    let count = 0;
    Object.keys(correctTable).forEach(qId => {
        if (answers[qId] && String(answers[qId]).trim() !== '') {
            count++;
        }
    });
    return count;
}

function isTestReadyToSubmit() {
    const rCount = getAnsweredCount('reading');
    const wP1Count = getAnsweredCount('writing');
    const wAns = candidate.answers.writing || {};
    const hasP2 = wAns['w_part2'] && wAns['w_part2'].trim().length > 0;
    const hasP3 = wAns['w_part3'] && wAns['w_part3'].trim().length > 0;
    return (rCount === TOTAL_READING_QUESTIONS) && (wP1Count === TOTAL_WRITING_P1_QUESTIONS) && hasP2 && hasP3;
}

function saveState() {
    if (appState === 'testing') {
        try {
            localStorage.setItem('petMockTestState_AI_R4P3_SEC', JSON.stringify(candidate));
        } catch (e) {
            console.error('Failed to save state:', e);
        }
    }
}

function loadState() {
    try {
        const savedData = localStorage.getItem('petMockTestState_AI_R4P3_SEC');
        if (savedData) {
            const loaded = JSON.parse(savedData);
            candidate = loaded;
            if (loaded.code && loaded.name) {
                appState = 'testing';
                if (loaded.timerRunning) {
                    runTimer();
                }
            }
        }
    } catch (e) {
        console.error('Failed to load state:', e);
        localStorage.removeItem('petMockTestState_AI_R4P3_SEC');
    }
}

function pauseTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    candidate.timerRunning = false;
    saveState();
}

function runTimer() {
    if (timerInterval) clearInterval(timerInterval);
    candidate.timerRunning = true;
    saveState();

    timerInterval = setInterval(() => {
        if (candidate.times[candidate.currentSkill] > 0) {
            candidate.times[candidate.currentSkill] -= 1;
            updateHeaderOnly();
            saveState();
        } else {
            pauseTimer();
            alert(`Time is up for ${candidate.currentSkill.toUpperCase()} section!`);
            if (candidate.currentSkill === 'reading') {
                handleSwitchSkill('writing');
            } else {
                showReportModal();
            }
        }
    }, 1000);
}

function handleToggleTimer() {
    if (candidate.timerRunning) {
        pauseTimer();
    } else {
        runTimer();
    }
    render();
}

function handleSwitchSkill(newSkill) {
    const wasRunning = candidate.timerRunning;
    pauseTimer();
    candidate.currentSkill = newSkill;
    render();
    if (wasRunning && candidate.times[newSkill] > 0) {
        runTimer();
    }
}

/* ============================ EVENT HANDLERS ============================ */
function handleStartTest(code, name, apiKey) {
    candidate.code = code;
    candidate.name = name;
    candidate.apiKey = apiKey;
    candidate.warningCount = 0;
    appState = 'testing';
    runTimer();
    render();

    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => console.warn(err));
    }
}

function handleSaveAnswer(skill, qId, value) {
    candidate.answers[skill] = candidate.answers[skill] || {};
    candidate.answers[skill][qId] = value;
    saveState();
    updateHeaderOnly();
}

function showEndTestModal() {
    if (!isTestReadyToSubmit()) return;
    pauseTimer();
    isEndModalOpen = true;
    render();
}

function closeEndTestModal() {
    isEndModalOpen = false;
    if (!candidate.timerRunning && candidate.times[candidate.currentSkill] > 0) {
        runTimer();
    }
    render();
}

function showReportModal() {
    pauseTimer();
    isEndModalOpen = false;
    isReportModalOpen = true;
    render();
}

function handleReset() {
    pauseTimer();
    localStorage.removeItem('petMockTestState_AI_R4P3_SEC');
    candidate = JSON.parse(JSON.stringify(INITIAL_CANDIDATE_STATE));
    appState = 'setup';
    isReportModalOpen = false;
    aiEvaluationResult = null;
    window.location.reload();
}

/* ============================ GEMINI AI INTEGRATION ============================ */
async function evaluateWritingWithGemini() {
    if (!candidate.apiKey) {
        alert("Please provide a valid Gemini API Key to enable AI scoring.");
        return;
    }

    const wAnswers = candidate.answers.writing || {};
    const part2Ans = wAnswers['w_part2'] || 'No answer provided.';
    const part3Ans = wAnswers['w_part3'] || 'No answer provided.';

    const prompt = `You are an official Cambridge PET (B1 Preliminary) Writing Examiner. Evaluate the candidate's responses strictly according to CEFR B1 descriptors (Content, Communicative Achievement, Organisation, Language - each 0-5 scale).

=== CANDIDATE DETAILS ===
Name: ${candidate.name}
Code: ${candidate.code}

=== PART 2 TASK (35-45 words Note) ===
Prompt: Write a note to Alex explaining where you bought a new computer game, why you like it, and invite Alex to play.
Candidate Response:
"${part2Ans}"

=== PART 3 TASK (~100 words Letter or Story) ===
Prompt 7 (Letter about places to visit) OR Prompt 8 (Story starting with "I woke up feeling very excited.").
Candidate Response:
"${part3Ans}"

=== EVALUATION REQUIREMENTS ===
Return pure JSON with exact schema:
{
  "part2": {
    "score": "X/5",
    "wordCount": 0,
    "content": "Feedback...",
    "communicative": "Feedback...",
    "organisation": "Feedback...",
    "language": "Feedback...",
    "overallFeedback": "Summary...",
    "correctedVersion": "Improved version..."
  },
  "part3": {
    "score": "X/5",
    "wordCount": 0,
    "content": "Feedback...",
    "communicative": "Feedback...",
    "organisation": "Feedback...",
    "language": "Feedback...",
    "overallFeedback": "Summary...",
    "correctedVersion": "Improved version..."
  }
}`;

    isEvaluatingAI = true;
    render();

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${candidate.apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        aiEvaluationResult = JSON.parse(rawText);
    } catch (err) {
        console.error("Gemini AI Error:", err);
        alert("Failed to evaluate with Gemini AI. Check API Key or Internet connection.");
    } finally {
        isEvaluatingAI = false;
        render();
    }
}

/* ============================ ANSWER CHECKING ============================ */
function checkAnswer(qId, value, skill = 'reading') {
    const correctTable = skill === 'reading' ? READING_CORRECT_ANSWERS : WRITING_CORRECT_ANSWERS;
    const correct = correctTable[qId];
    if (!correct) return null;

    if (Array.isArray(correct)) {
        const valStr = String(value || '').trim().toLowerCase();
        return correct.some(c => c.toLowerCase() === valStr);
    }

    return String(value || '').trim().toLowerCase() === String(correct).trim().toLowerCase();
}

function renderReadingPassages() {

            <div class="border p-5 bg-white text-sm space-y-4 rounded shadow-sm leading-relaxed">
                <h5 class="font-bold text-xl text-center mb-4 uppercase text-[#003366]">Circus Oz</h5>
                <p>In 1977 two already successful circus groups, Soapbox Circus and the New Circus, joined together to start Circus Oz. The performers loved ordinary circus skills but they wanted to make a different kind of show, adding music, theatre and comment. They got together a collection of old trucks and caravans and went on the road. It was a fresh and original voice in circus and was immediately popular with audiences. Only one of the original members of the circus remains now but it has kept the same aims.</p>

                <p>Last year one publisher, Martins, started publishing a series called Waves. We spoke to the director Julia Smith. She explained, 'Teenage fiction has been published since the 1970s but publishers have never been particularly successful in getting teenagers to buy and read books. Now they're realising that teenagers aren't just older children but they're not adults either and often aren't interested in adult fiction. For this series we're looking for new writers who write especially for teenagers.'</p>
                <p>Athene Gorr's novel was published in the series last year and is selling well. Its title is The Purple Ring. She says, 'The important thing is to persuade teenagers to pick up your book. I'm a new writer so, although I've got an unusual name which people might remember, nobody knows it yet! But my book has a fantastic cover which makes people want to look inside. Then they realise what a brilliant story it is!'</p>
                <p>And what do teenagers themselves think about the series? We talked to Sophie Clarke, aged 15. She said, 'I've read a few books in the Waves series. They say they're for 14-19 year olds and I agree with that. We're not interested in the same things as people in their twenties and thirties. I like them and I think they look really good too. The only thing is that because bookshops put them in the children's section, lots of teenagers won't find them so they may not do very well. And it's a shame there's no non-fiction in the series as I think lots of teenagers, especially boys, might buy that.'</p>
            </div>
        </div>

        <div id="reading-part-5" class="mb-8">
            <h4 class="text-lg font-semibold mb-2 text-[#f97316]">Part 5</h4>
            <p class="mb-4 text-sm font-medium italic">Read the text below and choose the correct word for each space.</p>
            <div class="border p-5 bg-white text-sm space-y-4 leading-loose rounded shadow-sm">
                <h5 class="font-bold text-xl text-center mb-4 uppercase text-[#003366]">Levi Strauss</h5>
                <p>In 1853, Levi Strauss (0) <span class="font-bold border-b border-black">travelled</span> to San Francisco from New York. His brothers (26) ___________ a business there selling pillows, blankets and clothes and Levi went to help them. He worked (27) ___________ and, over the (28) ___________ twenty years, he expanded the business.</p>
                <p>(29) ___________ day in 1872, Levi (30) ___________ a letter from Jacob Davis who made men's clothes. In the letter Jacob (31) ___________ Levi about a difficult customer. He kept (32) ___________ tearing the pockets of his trousers. Jacob had found an answer – he had added some metal to the corners of the pockets. Levi recognised a business opportunity (33) ___________ the two men started working together. They decided to (34) ___________ some trousers out of denim, a material which was suitable for working clothes. The first pair of denim blue jeans (35) ___________ produced in 1873. Today people all around the world wear Levi jeans every day.</p>
            </div>
        </div>
    </div>`;
}

function radioInput(name, value, extraClass) {
    const answers = candidate.answers[candidate.currentSkill] || {};
    const checked = answers[name] === value ? 'checked' : '';
    return `<input type="radio" name="${name}" value="${value}" ${checked} class="${extraClass || ''}" onchange="handleSaveAnswer('${candidate.currentSkill}', '${name}', '${value}'); renderQuestionColumn();" />`;
}

function textInput(id, placeholder, extraClass) {
    const answers = candidate.answers[candidate.currentSkill] || {};
    const value = answers[id] || '';
    return `<input type="text" id="${id}" value="${value.replace(/"/g,'&quot;')}" placeholder="${placeholder}" class="ielts-border rounded-md p-2 w-full ${extraClass || ''}" oninput="handleSaveAnswer('${candidate.currentSkill}', '${id}', this.value)" />`;
}

function renderHeader() {

    const isTimeLow = remainingTime <= 60 && remainingTime > 0;
    const rCount = getAnsweredCount('reading');
    const wP1Count = getAnsweredCount('writing');
    const readyToSubmit = isTestReadyToSubmit();

    return `
    <header class="header flex justify-between items-center px-4 md:px-8" id="app-header">
        <div class="flex items-center space-x-4">
            <span class="text-xl font-bold">PET MOCK TEST</span>
            <span class="hidden md:block text-sm font-medium opacity-80">${candidate.code} | ${candidate.name}</span>
            <span class="bg-blue-900 border border-blue-400 text-xs px-2 py-1 rounded font-bold">R: ${rCount}/${TOTAL_READING_QUESTIONS} | W: ${wP1Count}/${TOTAL_WRITING_P1_QUESTIONS}</span>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-right">
                <span class="block text-xs opacity-70">TIME REMAINING (${candidate.currentSkill.toUpperCase()})</span>
                <span class="text-2xl font-extrabold ${isTimeLow ? 'text-red-500' : 'text-[#f97316]'}" id="time-display">
                    ${formatTime(remainingTime)}
                </span>
            </div>
            <button class="action-button bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-md font-semibold" onclick="handleToggleTimer()" ${remainingTime <= 0 ? 'disabled' : ''}>
                ${candidate.timerRunning ? 'Pause' : 'Continue'}
            </button>
            <button class="action-button bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md font-semibold" 
                onclick="showEndTestModal()" 
                ${!readyToSubmit ? 'disabled title="Cần hoàn thành tất cả các câu hỏi Reading & Writing để nộp bài"' : ''}>
                End Test
            </button>
        </div>
    </header>`;
}

function updateHeaderOnly() {
    const timeDisplay = document.getElementById('time-display');
    if (timeDisplay) {
        const remainingTime = candidate.times[candidate.currentSkill];
        const isTimeLow = remainingTime <= 60 && remainingTime > 0;
        timeDisplay.textContent = formatTime(remainingTime);
        timeDisplay.className = `text-2xl font-extrabold ${isTimeLow ? 'text-red-500' : 'text-[#f97316]'}`;
    }
    const headerEl = document.getElementById('app-header');
    if (headerEl) {
        const rCount = getAnsweredCount('reading');
        const wP1Count = getAnsweredCount('writing');
        const endBtn = headerEl.querySelector('button[onclick="showEndTestModal()"]');
        const progressSpan = headerEl.querySelector('span.bg-blue-900');
        if (progressSpan) progressSpan.textContent = `R: ${rCount}/${TOTAL_READING_QUESTIONS} | W: ${wP1Count}/${TOTAL_WRITING_P1_QUESTIONS}`;
        if (endBtn) {
            const ready = isTestReadyToSubmit();
            endBtn.disabled = !ready;
            endBtn.title = !ready ? "Cần hoàn thành tất cả các câu hỏi Reading & Writing để nộp bài" : "";
        }
    }
}

    <div class="fixed inset-0 bg-red-950 bg-opacity-90 flex items-center justify-center p-4 z-[100]">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md text-center border-4 border-red-600">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-extrabold">⚠️</div>
            <h3 class="text-2xl font-extrabold text-red-600 mb-2">CẢNH BÁO VI PHẠM</h3>
            <p class="text-gray-800 font-medium mb-4">${warningMessage}</p>
            <div class="p-3 bg-red-50 rounded-lg border border-red-200 mb-6">
                <p class="text-sm font-bold text-red-700">Tổng số lần vi phạm: <span class="text-xl">${candidate.warningCount}</span></p>
                <p class="text-xs text-gray-500 mt-1">Lưu ý: Mọi hành vi vi phạm đều được ghi nhận vào bảng báo cáo kết quả!</p>
            </div>
            <button class="w-full py-3 rounded-md font-bold bg-red-600 hover:bg-red-700 text-white shadow-lg transition-colors" onclick="dismissWarning()">Tôi Đã Hiểu - Quay Lại Bài Thi</button>
        </div>
    </div>`;
}

function renderEndTestModal() {
    if (!isEndModalOpen) return '';
    return `
    <div class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg">
            <h3 class="text-2xl font-bold text-[#003366] mb-4">Confirm End Test</h3>
            <p class="mb-6 text-gray-700">Are you sure you want to end the test now? You will not be able to continue after confirming.</p>
            <div class="flex justify-end space-x-4">
                <button class="py-2 px-4 rounded-md font-semibold bg-gray-300 hover:bg-gray-400 text-gray-800" onclick="closeEndTestModal()">Cancel</button>
                <button class="py-2 px-4 rounded-md font-semibold bg-red-600 hover:bg-red-700 text-white" onclick="showReportModal()">End & View Report</button>
            </div>
        </div>
    </div>`;
}

function renderReportModal() {
    if (!isReportModalOpen) return '';

    let detailedResultsHtml = '';

    // Reading
    const rAnswers = candidate.answers.reading || {};
    const rKeys = Object.keys(READING_CORRECT_ANSWERS);
    let rScore = 0;
    const rCards = rKeys.map(qId => {
        const val = rAnswers[qId] || '';
        const isCorrect = checkAnswer(qId, val, 'reading');
        if (isCorrect) rScore++;

        return `
            <div class="p-3 rounded border ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                <p class="font-bold text-[#003366]">${qId.toUpperCase()}</p>
                <p><strong>Your Answer:</strong> ${val || '-'}</p>
                <p><strong>Correct Answer:</strong> ${READING_CORRECT_ANSWERS[qId]}</p>
                <p class="font-semibold mt-1 ${isCorrect ? 'text-green-600' : 'text-red-600'}">
                    ${isCorrect ? '✓ Correct' : '✗ Incorrect'}
                </p>
            </div>`;
    }).join('');

    detailedResultsHtml += `
        <div>
            <h5 class="text-lg font-semibold text-[#f97316] mt-3 mb-2">READING</h5>
            <div class="space-y-3 p-4 bg-white ielts-border rounded-lg">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${rCards}</div>
                <div class="mt-4 pt-4 border-t text-xl font-bold text-center text-[#003366]">
                    Reading Score: ${rScore} / ${rKeys.length}
                </div>
            </div>
        </div>`;

    // Writing Part 1
    const wAnswers = candidate.answers.writing || {};
    const wKeys = Object.keys(WRITING_CORRECT_ANSWERS);
    let wScore = 0;
    const wCards = wKeys.map(qId => {
        const val = wAnswers[qId] || '';
        const isCorrect = checkAnswer(qId, val, 'writing');
        if (isCorrect) wScore++;

        return `
            <div class="p-3 rounded border ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                <p class="font-bold text-[#003366]">${qId.toUpperCase()}</p>
                <p><strong>Your Answer:</strong> ${val || '-'}</p>
                <p><strong>Key Options:</strong> ${WRITING_CORRECT_ANSWERS[qId].join(' / ')}</p>
                <p class="font-semibold mt-1 ${isCorrect ? 'text-green-600' : 'text-red-600'}">
                    ${isCorrect ? '✓ Correct' : '✗ Incorrect'}
                </p>
            </div>`;
    }).join('');

    detailedResultsHtml += `
        <div>
            <h5 class="text-lg font-semibold text-[#f97316] mt-6 mb-2">WRITING PART 1 (Sentence Transformation)</h5>
            <div class="space-y-3 p-4 bg-white ielts-border rounded-lg">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${wCards}</div>
                <div class="mt-4 pt-4 border-t text-xl font-bold text-center text-[#003366]">
                    Writing Part 1 Score: ${wScore} / ${wKeys.length}
                </div>
            </div>
        </div>`;

    // Gemini AI Section
    let aiSectionHtml = `
        <div class="mt-6 border-t pt-4">
            <div class="flex justify-between items-center mb-4">
                <h5 class="text-lg font-semibold text-[#003366]">WRITING PART 2 & 3 - GEMINI AI EVALUATION</h5>
                <button onclick="evaluateWritingWithGemini()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded shadow-md transition-all flex items-center gap-2" ${isEvaluatingAI ? 'disabled' : ''}>
                    ${isEvaluatingAI ? 'Evaluating with Gemini AI...' : '✨ Evaluate Writing with Gemini AI'}
                </button>
            </div>`;

    if (aiEvaluationResult) {
        aiSectionHtml += `
            <div class="space-y-6">
                <div class="p-5 bg-purple-50 border border-purple-200 rounded-lg">
                    <div class="flex justify-between items-center border-b border-purple-200 pb-2 mb-3">
                        <h6 class="font-bold text-purple-900 text-md">Part 2 Score: ${aiEvaluationResult.part2.score}</h6>
                        <span class="text-xs bg-purple-200 text-purple-800 font-bold px-2 py-1 rounded">Word Count: ${aiEvaluationResult.part2.wordCount || 'N/A'}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs mb-3">
                        <p><strong>Content:</strong> ${aiEvaluationResult.part2.content}</p>
                        <p><strong>Communicative:</strong> ${aiEvaluationResult.part2.communicative}</p>
                        <p><strong>Organisation:</strong> ${aiEvaluationResult.part2.organisation}</p>
                        <p><strong>Language:</strong> ${aiEvaluationResult.part2.language}</p>
                    </div>
                    <div class="text-xs bg-white p-3 rounded border border-purple-100 mb-2">
                        <p class="font-bold text-purple-900 mb-1">Overall Feedback:</p>
                        <p class="text-gray-700">${aiEvaluationResult.part2.overallFeedback}</p>
                    </div>
                    <div class="text-xs bg-white p-3 rounded border border-purple-100">
                        <p class="font-bold text-green-800 mb-1">Improved Version:</p>
                        <p class="italic text-gray-800">${aiEvaluationResult.part2.correctedVersion}</p>
                    </div>
                </div>

                <div class="p-5 bg-purple-50 border border-purple-200 rounded-lg">
                    <div class="flex justify-between items-center border-b border-purple-200 pb-2 mb-3">
                        <h6 class="font-bold text-purple-900 text-md">Part 3 Score: ${aiEvaluationResult.part3.score}</h6>
                        <span class="text-xs bg-purple-200 text-purple-800 font-bold px-2 py-1 rounded">Word Count: ${aiEvaluationResult.part3.wordCount || 'N/A'}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs mb-3">
                        <p><strong>Content:</strong> ${aiEvaluationResult.part3.content}</p>
                        <p><strong>Communicative:</strong> ${aiEvaluationResult.part3.communicative}</p>
                        <p><strong>Organisation:</strong> ${aiEvaluationResult.part3.organisation}</p>
                        <p><strong>Language:</strong> ${aiEvaluationResult.part3.language}</p>
                    </div>
                    <div class="text-xs bg-white p-3 rounded border border-purple-100 mb-2">
                        <p class="font-bold text-purple-900 mb-1">Overall Feedback:</p>
                        <p class="text-gray-700">${aiEvaluationResult.part3.overallFeedback}</p>
                    </div>
                    <div class="text-xs bg-white p-3 rounded border border-purple-100">
                        <p class="font-bold text-green-800 mb-1">Improved Version:</p>
                        <p class="italic text-gray-800">${aiEvaluationResult.part3.correctedVersion}</p>
                    </div>
                </div>
            </div>`;
    } else {
        aiSectionHtml += `<p class="text-sm italic text-gray-500">Click the button above to generate an instant CEFR B1 score and detailed evaluation using Gemini AI.</p>`;
    }

    aiSectionHtml += `</div>`;

    return `
    <div class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col">
            <h3 class="text-2xl font-bold text-[#003366] mb-4 border-b pb-2">TEST RESULT REPORT</h3>
            <div class="space-y-4 text-sm mb-4 overflow-y-auto custom-scrollbar flex-grow">
                <div class="p-4 bg-gray-50 rounded-lg grid grid-cols-1 md:grid-cols-3 gap-4 border">
                    <div><p><strong>Candidate Code:</strong></p><p class="text-base text-[#003366] font-bold">${candidate.code}</p></div>
                    <div><p><strong>Full Name:</strong></p><p class="text-base text-[#003366] font-bold">${candidate.name}</p></div>
                    <div><p><strong>Security Violations:</strong></p><p class="text-base ${candidate.warningCount > 0 ? 'text-red-600 font-extrabold' : 'text-green-600 font-bold'}">${candidate.warningCount} Warnings</p></div>
                </div>
                <h4 class="text-xl font-bold text-[#003366] mt-4 mb-2">REMAINING TIME</h4>
                <div class="grid grid-cols-2 gap-4 p-3 bg-gray-50 rounded-lg border">
                    <p><strong>Reading:</strong> ${formatTime(candidate.times.reading)}</p>
                    <p><strong>Writing:</strong> ${formatTime(candidate.times.writing)}</p>
                </div>
                <h4 class="text-xl font-bold text-[#003366] mt-4 mb-2">DETAILED RESULTS</h4>
                ${detailedResultsHtml}
                ${aiSectionHtml}
            </div>
            <div class="flex justify-end space-x-4 sticky bottom-0 bg-white pt-4 border-t mt-auto">
                <button class="py-2 px-4 rounded-md font-semibold bg-gray-300 hover:bg-gray-400 text-gray-800" onclick="handleReset()">Close & Finish</button>
            </div>
        </div>
    </div>`;
}

/* ============================ SETUP SCREEN ============================ */
let setupError = '';

function renderSetupScreen() {
    return `
    <div class="fixed inset-0 bg-gray-100 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-200">
            <h2 class="text-xl font-semibold text-center text-green-800 mb-2">APLUS FOREIGN LANGUAGE CENTRE</h2>
            <h1 class="text-3xl font-bold text-center text-[#003366] mb-6">PET MOCK TEST (R4-P3)</h1>
            <p class="text-center text-gray-600 mb-6">Please enter candidate details to begin.</p>
            <div class="space-y-4">
                <div>
                    <label for="candidate-code" class="block text-sm font-medium text-gray-700">Candidate Code</label>
                    <input type="text" id="candidate-code" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-[#f97316] focus:border-[#f97316]" placeholder="e.g., APL0101" />
                </div>
                <div>
                    <label for="full-name" class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="full-name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-[#f97316] focus:border-[#f97316]" placeholder="e.g., Phan Ngoc Huy" />
                </div>
                <div>
                    <label for="api-key" class="block text-sm font-medium text-gray-700">Gemini API Key (Optional for AI Scoring)</label>
                    <input type="password" id="api-key" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-[#f97316] focus:border-[#f97316]" placeholder="AIzaSy..." />
                </div>
            </div>
            ${setupError ? `<p class="text-red-500 text-center mt-4">${setupError}</p>` : ''}
            <button onclick="handleSetupSubmit()" class="mt-8 w-full bg-[#f97316] text-white py-3 rounded-md font-bold hover:bg-[#e16913] transition-colors shadow-lg">
                START TEST
            </button>
            <button class="mt-4 text-xs text-gray-400 hover:text-red-500 underline mx-auto block" onclick="handleReset()">
                Clear Old Data & Restart
            </button>
        </div>
    </div>`;
}

function handleSetupSubmit() {
    const code = document.getElementById('candidate-code').value;
    const name = document.getElementById('full-name').value;
    const apiKey = document.getElementById('api-key').value;
    if (!code.trim() || !name.trim()) {
        setupError = 'Please enter both Candidate Code and Full Name.';
        render();
        return;
    }
    setupError = '';
    handleStartTest(code, name, apiKey);
}

/* ============================ MAIN RENDER ============================ */
function render() {
    if (appState === 'setup') {
        root.innerHTML = renderSetupScreen();
        return;
    }

    root.innerHTML = `
        <div class="app-container">
            ${renderHeader()}
            ${renderSkillTabs()}
            <main class="main-content">
                ${candidate.currentSkill === 'reading' ? renderReadingContent() : renderWritingContent()}
            </main>
        </div>
        ${renderWarningModal()}
        ${renderEndTestModal()}
        ${renderReportModal()}
    `;
}

/* ============================ INITIALIZATION ============================ */
loadState();
render();
</script>
</body>
</html>
