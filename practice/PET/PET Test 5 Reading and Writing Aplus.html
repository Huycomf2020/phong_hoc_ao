<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PET Reading Mock Test - Test 3 (2025)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
    body {
        font-family: 'Inter', sans-serif;
        background-color: #f7f7f7;
        overflow-y: hidden;
        margin: 0;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-height: 100vh;
    }
    .header {
        background-color: #003366;
        color: white;
        padding: 1rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        min-height: 64px;
    }
    .main-content {
        flex-grow: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .skill-tabs {
        background-color: #e5e7eb;
        padding: 0 1rem;
        border-bottom: 2px solid #ccc;
    }
    .tab-button {
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        color: #4b5563;
        border-radius: 8px 8px 0 0;

        transition: all 0.2s;
        margin-right: 2px;
        border: none;
        background-color: transparent;
    }
    .tab-button.active {
        background-color: white;
        color: #003366;
        border-top: 3px solid #f97316;
    }

        overflow-y: auto;
        padding: 1rem 1.5rem;
        background-color: white;
    }

        border: 1px solid #d1d5db;
    }
    .reading-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
        height: 100%;
    }
    @media (min-width: 1024px) {
        .reading-grid {
            grid-template-columns: 1fr 1fr;
        }
    }
    .reading-passage-column, .reading-question-column {
        overflow-y: auto;
        padding: 1rem;
        border-radius: 0.5rem;
        height: calc(100vh - 180px);
    }
    .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #ccc;
        border-radius: 4px;
    }
    .action-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .avatar-circle {
        width: 48px;
        height: 48px;
        border-radius: 9999px;
        background-color: #cbd5e1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #334155;
        flex-shrink: 0;
    }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================ CONSTANTS ============================ */
const SKILL_ORDER = ['reading'];
const INITIAL_TIMES = { reading: 50 * 60 }; // 50 minutes (Reading portion of the 1h30 combined paper)

const READING_CORRECT_ANSWERS = {
    'r_q1': 'C', 'r_q2': 'A', 'r_q3': 'C', 'r_q4': 'B', 'r_q5': 'B',
    'r_q6': 'H', 'r_q7': 'G', 'r_q8': 'B', 'r_q9': 'C', 'r_q10': 'F',
    'r_q11': 'A', 'r_q12': 'A', 'r_q13': 'B', 'r_q14': 'B', 'r_q15': 'B',
    'r_q16': 'A', 'r_q17': 'A', 'r_q18': 'A', 'r_q19': 'B', 'r_q20': 'A',
    'r_q21': 'C', 'r_q22': 'B', 'r_q23': 'D', 'r_q24': 'A', 'r_q25': 'C',
    'r_q26': 'B', 'r_q27': 'D', 'r_q28': 'A', 'r_q29': 'B', 'r_q30': 'C',
    'r_q31': 'B', 'r_q32': 'A', 'r_q33': 'C', 'r_q34': 'D', 'r_q35': 'A'
};

const INITIAL_CANDIDATE_STATE = {
    code: '',
    name: '',
    currentSkill: 'reading',
    answers: { reading: {} },
    times: { ...INITIAL_TIMES },
    timerRunning: false,
};

/* ============================ STATE ============================ */
let appState = 'setup'; // 'setup' | 'testing'
let candidate = JSON.parse(JSON.stringify(INITIAL_CANDIDATE_STATE));
let isEndModalOpen = false;
let isReportModalOpen = false;
let timerInterval = null;

const root = document.getElementById('root');

/* ============================ HELPERS ============================ */
function formatTime(seconds) {
    const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
}

function saveState() {
    if (appState === 'testing') {
        try {
            localStorage.setItem('petMockTestState5', JSON.stringify(candidate));
        } catch (e) {
            console.error('Failed to save state to localStorage:', e);
        }
    }
}

function loadState() {
    try {
        const savedData = localStorage.getItem('petMockTestState5');
        if (savedData) {
            const loaded = JSON.parse(savedData);
            candidate = loaded;
            if (loaded.code && loaded.name) {
                appState = 'testing';
                if (loaded.timerRunning) {
                    runTimer();
                }
            }
        }
    } catch (e) {
        console.error('Failed to load state from localStorage:', e);
        localStorage.removeItem('petMockTestState5');
    }
}

function pauseTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    candidate.timerRunning = false;
    saveState();
}

function runTimer() {
    if (timerInterval) return;
    candidate.timerRunning = true;
    saveState();

    timerInterval = setInterval(() => {
        if (candidate.times[candidate.currentSkill] > 0) {
            candidate.times[candidate.currentSkill] -= 1;
            updateHeaderOnly();
            saveState();
            checkTimerEnd();
        }
    }, 1000);
}

function checkTimerEnd() {
    const time = candidate.times[candidate.currentSkill];
    if (time <= 0) {
        pauseTimer();
        if (candidate.currentSkill === 'reading') {
            showReportModal();
        }
    }
}

function handleStartTest(code, name) {
    candidate.code = code;
    candidate.name = name;
    appState = 'testing';
    runTimer();
    render();

    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => {
            console.warn(`Error attempting to enable fullscreen: ${err.message}`);
        });
    }
}

function handleSwitchSkill(newSkill) {
    pauseTimer();
    candidate.currentSkill = newSkill;
    render();
}

function handleSaveAnswer(skill, qId, value) {
    candidate.answers[skill] = candidate.answers[skill] || {};
    candidate.answers[skill][qId] = value;
    saveState();
}

function handleToggleTimer() {
    if (candidate.timerRunning) {
        pauseTimer();
    } else {
        runTimer();
    }
    render();
}

function showEndTestModal() {
    pauseTimer();
    isEndModalOpen = true;
    render();
}

function closeEndTestModal() {
    isEndModalOpen = false;
    render();
}

function showReportModal() {
    pauseTimer();
    isEndModalOpen = false;
    isReportModalOpen = true;
    render();
}

function handleReset() {
    pauseTimer();
    localStorage.removeItem('petMockTestState5');
    candidate = JSON.parse(JSON.stringify(INITIAL_CANDIDATE_STATE));
    appState = 'setup';
    isReportModalOpen = false;
    window.location.reload();
}

/* ============================ ANSWER CHECKING ============================ */
function checkAnswer(qId, value) {
    const correct = READING_CORRECT_ANSWERS[qId];
    if (!correct) return null;

    if (Array.isArray(correct)) {
        if (!Array.isArray(value)) return false;
        const sortedCorrect = [...correct].sort();
        const sortedValue = [...value].sort();
        return sortedCorrect.length === sortedValue.length && sortedCorrect.every((v, i) => v === sortedValue[i]);
    }

    if (Array.isArray(value)) return false;
    return String(value || '').trim().toLowerCase() === String(correct).trim().toLowerCase();
}

function generateReportText() {
    let report = `PET MOCK TEST REPORT\n`;
    report += `=========================\n`;
    report += `Candidate Code: ${candidate.code}\n`;
    report += `Full Name: ${candidate.name}\n\n`;

    report += `REMAINING TIME\n`;
    report += `-------------------------\n`;
    report += `Reading: ${formatTime(candidate.times.reading)}\n\n`;

    SKILL_ORDER.forEach(skill => {
        report += `${skill.toUpperCase()} ANSWERS\n`;
        report += `-------------------------\n`;
        const answers = candidate.answers[skill] || {};
        const answerKeys = Object.keys(READING_CORRECT_ANSWERS);

        if (answerKeys.length === 0) {
            report += "No answers recorded.\n";
        } else {
            let score = 0;
            answerKeys.forEach(qId => {
                let answerValue = answers[qId] || '';
                const isCorrect = checkAnswer(qId, answerValue);
                if (isCorrect) score++;

                if (Array.isArray(answerValue)) answerValue = answerValue.join(', ');
                const correctValue = Array.isArray(READING_CORRECT_ANSWERS[qId])
                    ? READING_CORRECT_ANSWERS[qId].join(', ')
                    : READING_CORRECT_ANSWERS[qId];

                report += `${qId.toUpperCase()}:\n`;
                report += `  Your Answer: ${answerValue}\n`;
                report += `  Correct Answer: ${correctValue}\n`;
                report += `  Status: ${isCorrect ? 'Correct' : 'Incorrect'}\n\n`;
            });
            report += `Score: ${score} / ${answerKeys.length}\n`;
        }
        report += `\n`;
    });
    return report;
}

function handleCopyReport() {
    const text = generateReportText();
    navigator.clipboard.writeText(text).then(() => {
        alert("Report copied to clipboard!");
    }).catch(err => {
        console.error("Failed to copy report:", err);
        alert("Failed to copy report. Please copy manually.");
    });
}

/* ============================ ANSWER INPUT ============================ */
function radioInput(name, value, extraClass) {
    const answers = candidate.answers[candidate.currentSkill] || {};
    const checked = answers[name] === value ? 'checked' : '';
    return `<input type="radio" name="${name}" value="${value}" ${checked} class="${extraClass || ''}" onchange="handleSaveAnswer('${candidate.currentSkill}', '${name}', '${value}'); renderQuestionColumn();" />`;
}

function textInput(id, placeholder, extraClass) {
    const answers = candidate.answers[candidate.currentSkill] || {};
    const value = answers[id] || '';
    return `<input type="text" id="${id}" value="${value.replace(/"/g,'&quot;')}" placeholder="${placeholder}" class="ielts-border rounded-md p-2 w-full ${extraClass || ''}" oninput="handleSaveAnswer('${candidate.currentSkill}', '${id}', this.value)" />`;
}

/* ============================ READING PASSAGES (LEFT COLUMN) ============================ */
function renderReadingPassages() {
    return `
    <div class="reading-passage-column bg-gray-50 ielts-border custom-scrollbar">
        <h3 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2 sticky top-0 bg-gray-50 z-10">READING PASSAGE CONTENT</h3>

        <div id="reading-part-1" class="mb-8 border-b pb-4">
            <h4 class="text-lg font-semibold mb-2 text-[#f97316]">Part 1</h4>
            <p class="mb-4 text-sm font-medium italic">Look at the text in each question. What does it say?</p>
            <div class="space-y-6">
                <div class="border p-4 rounded bg-white">
                    <p class="font-bold mb-2">1</p>
                    <div class="border-2 border-black p-4 bg-white mb-3 text-sm text-center">
                        <p class="font-bold text-lg">THESE BOOKS CAN BE BORROWED FOR TWO DAYS WITH THE PERMISSION OF A TEACHER</p>
                    </div>
                </div>
                <div class="border p-4 rounded bg-white">
                    <p class="font-bold mb-2">2</p>
                    <div class="border p-3 bg-gray-100 mb-3 text-sm italic">
                        <p class="mb-2">James</p>
                        <p>Neil rang. He can't play tennis with you tomorrow unless you lend him a racket because his is broken and can't be repaired.</p>
                    </div>
                </div>
                <div class="border p-4 rounded bg-white">
                    <p class="font-bold mb-2">3</p>
                    <div class="border-2 border-black p-4 bg-gray-100 mb-3 text-sm text-center">
                        <p class="font-bold text-lg">THIS BRIDGE WILL BE CLOSED FOR REPAIRS FROM SUNDAY MIDDAY FOR TWO WEEKS</p>
                    </div>
                </div>
                <div class="border p-4 rounded bg-white">
                    <p class="font-bold mb-2">4</p>
                    <div class="border border-black bg-gray-100 mb-3 text-sm">
                        <div class="border-b border-black p-2 bg-gray-200">
                            <p><strong>To:</strong> Emma</p>
                            <p><strong>From:</strong> Anna</p>
                        </div>
                        <div class="p-3">
                            <p>Hi Emma<br/>Can you look for my hat? I had it in your car so it might be there. If not, it might be in your flat somewhere.<br/>Love Anna</p>
                        </div>
                    </div>
                </div>
                <div class="border p-4 rounded bg-white">
                    <p class="font-bold mb-2">5</p>
                    <div class="border-2 border-black p-4 bg-white mb-3 text-sm text-center">
                        <p class="font-bold text-lg">If you want to go on trip to Edinburgh, pay £20 deposit by Thursday.</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="reading-part-2" class="mb-8 border-b pb-4">
            <h4 class="text-lg font-semibold mb-2 text-[#f97316]">Part 2</h4>
            <p class="mb-4 text-sm font-medium italic">The people below all want to watch a TV programme.<br/>On the opposite page there are eight reviews of TV programmes.<br/>Decide which programme would be the most suitable for the following people.</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div class="border p-3 bg-white"><p class="font-bold">A Around the world</p><p>A camera crew and reporter spent a year following the band Skyline round the world. They're not very well known themselves but played with some famous bands. You'll see some recordings of their tours and see what really goes on behind the stage, as well as hear Skyline answer the reporter's questions.</p></div>
                <div class="border p-3 bg-white"><p class="font-bold">B Mickey Valdone</p><p>Mickey Valdone, one of the funniest men on TV, has his usual amazing selection of famous guests from the worlds of music, films, comedy and sport. Between each guest, there will be a chance to hear Mickey's band play some music.</p></div>
                <div class="border p-3 bg-white"><p class="font-bold">C A Lost World</p><p>This 30-minute programme is about some old films made at the beginning of the last century by two photographers. They were lost until a few years ago and show people going about their daily lives in the industrial cities of northern England.</p></div>
                <div class="border p-3 bg-white"><p class="font-bold">D Young Dennis</p><p>This is a chance to see a wonderful comedy series again. This is the first programme ever shown and the rest of the series will be on over the next eight weeks. The actors, who were unknown when it first appeared, are now famous. The whole family will enjoy it.</p></div>
                <div class="border p-3 bg-white"><p class="font-bold">E Ticket to Africa</p><p>William Fogg is a news reporter who has recently spent six months in Africa. This programme is the story of his journey. His aim was to talk to the people he met and find out more about their lives. There is also a book available which contains some beautiful photographs.</p></div>
                <div class="border p-3 bg-white"><p class="font-bold">F Where and when</p><p>This early-evening programme has become a family favourite. Each week two famous celebrities choose their teams from the audience and for the next 30 minutes answer questions on a range of subjects including sport, music, novels and the latest news.</p></div>
                <div class="border p-3 bg-white"><p class="font-bold">G Sammy</p><p>Actor James McVee, who is famous for the film parts he has played, stars in this latest TV series to reach our screens from Australia. It's about a musician who wants to be famous but he isn't quite good enough. It's the funniest half hour you'll see on TV this week.</p></div>
                <div class="border p-3 bg-white"><p class="font-bold">H The House on the Hill</p><p>Martin Smithson has written the script for this two-part story taken from the book of the same name. Set in the 19th century, it follows a family as they move from one place to another. Most of the actors are very well known and the costumes are wonderful.</p></div>
            </div>
        </div>

        <div id="reading-part-3" class="mb-8 border-b pb-4">
            <h4 class="text-lg font-semibold mb-2 text-[#f97316]">Part 3</h4>
            <p class="mb-4 text-sm font-medium italic">Look at the sentences below about a circus in Australia.<br/>Read the text on the opposite page to decide if each sentence is correct or incorrect.</p>
            <div class="border p-5 bg-white text-sm space-y-4">
                <h5 class="font-bold text-xl text-center mb-4 uppercase">Circus Oz</h5>
                <p>In 1977 two already successful circus groups, Soapbox Circus and the New Circus, joined together to start Circus Oz. The performers loved ordinary circus skills but they wanted to make a different kind of show, adding music, theatre and comment. They got together a collection of old trucks and caravans and went on the road. It was a fresh and original voice in circus and was immediately popular with audiences. Only one of the original members of the circus remains now but it has kept the same aims.</p>
                <p>Since that time, Circus Oz has performed in 26 different countries. In the mid-1980s new circus groups began to appear across the world and Circus Oz performers went to train with acrobats from China's Nanjing Acrobatic Troupe. Many of the skills learnt then are still in the show, although the style is now definitely Circus Oz rather than Chinese.</p>
                <p>As with all circuses, performances take place inside a tent or Big Top. Circus Oz's first tent was sewn together by performers in a large basement. It was used for years to tour Australia but when it became too small, Circus Oz was forced to hire tents or move into theatres.</p>
                <p>In 2002, Circus Oz had a new tent made. It is designed with few poles inside so people watching can see better than in other circuses.</p>
                <p>The performances are suitable for people of all ages and each show features a live band. The Big Top is heated and air-conditioned but audiences need to dress for the time of year. Snacks and drinks are served in the Big Top but not full meals.</p>

                <p>Athene Gorr's novel was published in the series last year and is selling well. Its title is The Purple Ring. She says, 'The important thing is to persuade teenagers to pick up your book. I'm a new writer so, although I've got an unusual name which people might remember, nobody knows it yet! But my book has a fantastic cover which makes people want to look inside. Then they realise what a brilliant story it is!'</p>
                <p>And what do teenagers themselves think about the series? We talked to Sophie Clarke, aged 15. She said, 'I've read a few books in the Waves series. They say they're for 14-19 year olds and I agree with that. We're not interested in the same things as people in their twenties and thirties. I like them and I think they look really good too. The only thing is that because bookshops put them in the children's section, lots of teenagers won't find them so they may not do very well. And it's a shame there's no non-fiction in the series as I think lots of teenagers, especially boys, might buy that.'</p>
            </div>
        </div>

        <div id="reading-part-5" class="mb-8">
            <h4 class="text-lg font-semibold mb-2 text-[#f97316]">Part 5</h4>
            <p class="mb-4 text-sm font-medium italic">Read the text below and choose the correct word for each space.</p>
            <div class="border p-5 bg-white text-sm space-y-4 leading-loose">
                <h5 class="font-bold text-xl text-center mb-4 uppercase">Levi Strauss</h5>
                <p>In 1853, Levi Strauss (0) <span class="font-bold border-b border-black">travelled</span> to San Francisco from New York. His brothers (26) ___________ a business there selling pillows, blankets and clothes and Levi went to help them. He worked (27) ___________ and, over the (28) ___________ twenty years, he expanded the business.</p>

}

/* ============================ READING QUESTIONS (RIGHT COLUMN) ============================ */
function renderReadingQuestions() {
    const part1Items = [
        { q: "1", opts: [{v:'A', t:"Only teachers are allowed to borrow these books for longer than two days."}, {v:'B', t:"Give these books to a teacher when you bring them back after two days."}, {v:'C', t:"You need to ask a teacher before taking one of the books away for two days."}] },

        { q: "3", opts: [{v:'A', t:"This bridge will be repaired in two weeks' time beginning on Sunday at midday."}, {v:'B', t:"Repairs on this bridge will finish on Sunday at midday."}, {v:'C', t:"It will not be possible to use this bridge on Sunday after midday."}] },
        { q: "4", opts: [{v:'A', t:"Anna remembers leaving her hat in Emma's car."}, {v:'B', t:"Anna isn't sure exactly where her hat is."}, {v:'C', t:"Anna wants Emma to return the hat she borrowed."}] },
        { q: "5", opts: [{v:'A', t:"You'll need to take at least £20 with you to Edinburgh on Thursday."}, {v:'B', t:"Unless you pay £20 by Thursday, you won't be able to go to Edinburgh."}, {v:'C', t:"The trip to Edinburgh costs £20 in total to be paid by Thursday."}] },
    ];

    let part1Html = part1Items.map((item, i) => `
        <div class="border p-3 rounded-lg bg-gray-50">
            <p class="font-medium mb-3">${item.q}</p>
            <div class="space-y-2">
                ${item.opts.map(opt => `
                    <label class="block cursor-pointer text-sm">
                        ${radioInput(`r_q${i+1}`, opt.v, 'mr-2')}
                        ${opt.v} ${opt.t}
                    </label>`).join('')}
            </div>
        </div>`).join('');

    const part2People = [
        { n: 6, name: 'Mitsuki', desc: "Mitsuki likes reading and enjoys watching historical dramas which are based on novels. She would like to watch one which has some famous actors in it." },
        { n: 7, name: 'Callum', desc: "Callum wants to watch a comedy programme. He would like to see something new which hasn't been on TV before. He prefers to watch short programmes of about 30 minutes." },
        { n: 8, name: 'Keiko', desc: "Keiko loves listening to music and reading about famous stars. She wants to watch some stars being interviewed and she'd like to see some live music in the same programme." },
        { n: 9, name: 'Yann', desc: "Yann is interested in history and wants to watch a documentary which will tell him how people used to live in the past." },
        { n: 10, name: 'Ellen', desc: "Ellen is looking for a programme which she can watch with her children. Ellen is interested in current affairs and what's going on around the world. Her children like music." },
    ];
    let part2Html = part2People.map(p => `
        <div class="flex items-start justify-between border-b pb-3 mb-3 gap-3">
            <div class="flex items-start gap-3">
                <div class="avatar-circle">${p.name.charAt(0)}</div>
                <div>
                    <span class="font-semibold block">${p.n}. ${p.name}</span>
                    <p class="text-sm text-gray-600">${p.desc}</p>
                </div>
            </div>
            ${textInput(`r_q${p.n}`, 'A-H', 'w-16 text-center flex-shrink-0')}
        </div>`).join('');

    const part3Sentences = [
        "11 Circus Oz was formed by people who had some experience of working in circuses.",
        "12 The aim of Circus Oz was to combine traditional circus skills with new ideas.",
        "13 Apart from one member, the performers are the same as when Circus Oz started.",
        "14 Some members of Circus Oz have joined a Chinese circus.",
        "15 When Circus Oz first started, the tents were hired.",
        "16 The audience has a better view at a Circus Oz show than at other circuses.",
        "17 Musicians perform with Circus Oz.",
        "18 Some food is available during Circus Oz performances.",
        "19 Beginners can join the Circus Skills class.",
        "20 There are classes for two age groups in the holidays."
    ];
    let part3Html = part3Sentences.map((text, i) => `
        <div class="mb-4 border-b pb-2">
            <p class="text-sm mb-2">${text}</p>
            <div class="space-x-4">
                <label class="cursor-pointer text-sm">${radioInput(`r_q${11+i}`, 'A', 'mr-1')} A (Correct)</label>
                <label class="cursor-pointer text-sm">${radioInput(`r_q${11+i}`, 'B', 'mr-1')} B (Incorrect)</label>
            </div>
        </div>`).join('');

    const part4Items = [
        { q: "21 What is the writer trying to do?", opts: [{v:'A', t:"persuade authors to write more teenage fiction"}, {v:'B', t:"explain why teenage fiction is easier to write than adult fiction"}, {v:'C', t:"give information about a new series of books"}, {v:'D', t:"compare different series of teenage fiction"}] },
        { q: "22 Julia Smith says publishers now recognise that teenagers", opts: [{v:'A', t:"can enjoy the same kind of stories as adults."}, {v:'B', t:"are neither children nor adults."}, {v:'C', t:"grow up more quickly nowadays."}, {v:'D', t:"are more interested in reading nowadays."}] },
        { q: "23 Athene Gorr thinks teenagers were attracted to her book because of", opts: [{v:'A', t:"her name."}, {v:'B', t:"the story."}, {v:'C', t:"its title."}, {v:'D', t:"its cover."}] },
        { q: "24 What does Sophie Clarke say about the books in the Waves series?", opts: [{v:'A', t:"They shouldn't be kept with children's books."}, {v:'B', t:"She would prefer to read adult fiction."}, {v:'C', t:"They will be bought by lots of teenagers."}, {v:'D', t:"She isn't keen on the design."}] },
        { q: "25 Which of these paragraphs could be used to advertise the Waves series?", opts: [
            {v:'A', t:"This series is for all teenagers and those who are nearly teenagers. Whether you're 10 or 19, you'll find something here to please you."},
            {v:'B', t:"Choose a book from the Waves series. It includes both fiction and non-fiction and is aimed at teenagers aged 14+."},
            {v:'C', t:"If you're aged between 14 and 19, don't miss the Waves series which has novels by new authors."},
            {v:'D', t:"The Waves series has been popular with teenagers since the 1970s. This year we have added 20 new writers to our list."}
        ] },
    ];
    let part4Html = part4Items.map((item, i) => `
        <div class="border p-3 rounded-lg bg-gray-50">
            <p class="font-medium mb-3">${item.q}</p>
            <div class="space-y-2">
                ${item.opts.map(opt => `
                    <label class="block cursor-pointer text-sm">
                        ${radioInput(`r_q${21+i}`, opt.v, 'mr-2')}
                        ${opt.v} ${opt.t}
                    </label>`).join('')}
            </div>
        </div>`).join('');

    const part5Items = [
        { n: 26, opts: ['A commanded', 'B ran', 'C influenced', 'D controlled'] },
        { n: 27, opts: ['A long', 'B strong', 'C heavy', 'D hard'] },
        { n: 28, opts: ['A next', 'B later', 'C last', 'D final'] },
        { n: 29, opts: ['A That', 'B One', 'C A', 'D The'] },
        { n: 30, opts: ['A realised', 'B fetched', 'C got', 'D gave'] },
        { n: 31, opts: ['A said', 'B told', 'C discussed', 'D described'] },
        { n: 32, opts: ['A on', 'B at', 'C up', 'D in'] },
        { n: 33, opts: ['A while', 'B but', 'C so', 'D since'] },
        { n: 34, opts: ['A making', 'B made', 'C makes', 'D make'] },
        { n: 35, opts: ['A was', 'B is', 'C did', 'D had'] },
    ];
    let part5Html = part5Items.map(item => `
        <div class="border p-3 rounded-lg bg-gray-50">
            <p class="font-medium mb-2 border-b pb-1">Question ${item.n}</p>
            <div class="space-y-1">
                ${item.opts.map(opt => {
                    const v = opt.charAt(0);
                    const t = opt.substring(2);
                    return `<label class="block cursor-pointer text-sm">${radioInput(`r_q${item.n}`, v, 'mr-2')} ${v} ${t}</label>`;
                }).join('')}
            </div>
        </div>`).join('');

    return `
    <div class="reading-question-column bg-white ielts-border custom-scrollbar" id="reading-question-column">
        <h3 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2 sticky top-0 bg-white z-10">READING QUESTIONS</h3>

        <div class="mb-8 border-b pb-4">
            <h4 class="text-lg font-semibold mb-2 text-[#003366]">Part 1: Questions 1–5</h4>
            <p class="mb-4 text-sm font-medium">Mark the correct letter A, B or C.</p>
            <div class="space-y-4">${part1Html}</div>
        </div>

        <div class="mb-8 border-b pb-4">
            <h4 class="text-lg font-semibold mb-2 text-[#003366]">Part 2: Questions 6–10</h4>
            <p class="mb-4 text-sm font-medium">Write the correct letter (A–H) for each person.</p>
            <div class="space-y-3 p-4 border rounded-lg bg-gray-50">${part2Html}</div>
        </div>

        <div class="mb-8 border-b pb-4">
            <h4 class="text-lg font-semibold mb-2 text-[#003366]">Part 3: Questions 11–20</h4>
            <p class="mb-4 text-sm font-medium">If it is correct, mark <strong>A</strong>. If it is not correct, mark <strong>B</strong>.</p>
            <div class="space-y-3 p-4 border rounded-lg bg-gray-50">${part3Html}</div>
        </div>

        <div class="mb-8 border-b pb-4">
            <h4 class="text-lg font-semibold mb-2 text-[#003366]">Part 4: Questions 21–25</h4>
            <p class="mb-4 text-sm font-medium">Mark the correct letter A, B, C or D.</p>
            <div class="space-y-4">${part4Html}</div>
        </div>

        <div class="mb-8">
            <h4 class="text-lg font-semibold mb-2 text-[#003366]">Part 5: Questions 26–35</h4>
            <p class="mb-4 text-sm font-medium">Mark the correct letter A, B, C or D.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${part5Html}</div>
        </div>
    </div>`;
}

function renderReadingContent() {
    return `
    <div class="skill-content" id="content-reading">
        <h2 class="text-2xl font-bold text-[#003366] mb-4 border-b pb-2">READING (Paper 1: Reading and Writing)</h2>
        <div class="reading-grid">
            ${renderReadingPassages()}
            ${renderReadingQuestions()}
        </div>
    </div>`;
}

// Re-render only the question column to preserve passage scroll position on answer change
function renderQuestionColumn() {
    const el = document.getElementById('reading-question-column');
    if (el) {
        const scrollTop = el.scrollTop;
        el.outerHTML = renderReadingQuestions();
        const newEl = document.getElementById('reading-question-column');
        if (newEl) newEl.scrollTop = scrollTop;
    }
}

/* ============================ HEADER / TABS ============================ */
function renderHeader() {
    const remainingTime = candidate.times[candidate.currentSkill];
    const isTimeLow = remainingTime <= 60 && remainingTime > 0;
    return `
    <header class="header flex justify-between items-center px-4 md:px-8" id="app-header">
        <div class="flex items-center space-x-4">
            <span class="text-xl font-bold">PET MOCK TEST</span>
            <span class="hidden md:block text-sm font-medium opacity-80">${candidate.code} | ${candidate.name}</span>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-right">
                <span class="block text-xs opacity-70">TIME REMAINING</span>
                <span class="text-2xl font-extrabold ${isTimeLow ? 'text-red-500' : 'text-[#f97316]'}" id="time-display">
                    ${formatTime(remainingTime)}
                </span>
            </div>
            <button class="action-button bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-md font-semibold" onclick="handleToggleTimer()" ${remainingTime <= 0 ? 'disabled' : ''}>
                ${candidate.timerRunning ? 'Pause' : 'Continue'}
            </button>
            <button class="action-button bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md font-semibold" onclick="showEndTestModal()">
                End Test
            </button>
        </div>
    </header>`;
}

function updateHeaderOnly() {
    const timeDisplay = document.getElementById('time-display');
    if (timeDisplay) {
        const remainingTime = candidate.times[candidate.currentSkill];
        const isTimeLow = remainingTime <= 60 && remainingTime > 0;
        timeDisplay.textContent = formatTime(remainingTime);
        timeDisplay.className = `text-2xl font-extrabold ${isTimeLow ? 'text-red-500' : 'text-[#f97316]'}`;
    }
}

function renderSkillTabs() {
    return `
    <div class="skill-tabs flex">
        ${SKILL_ORDER.map(skill => `
            <button class="tab-button ${candidate.currentSkill === skill ? 'active' : ''}" onclick="handleSwitchSkill('${skill}')">
                ${skill.toUpperCase()}
            </button>`).join('')}
    </div>`;
}

/* ============================ MODALS ============================ */
function renderEndTestModal() {
    if (!isEndModalOpen) return '';
    return `
    <div class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg">
            <h3 class="text-2xl font-bold text-[#003366] mb-4">Confirm End Test</h3>
            <p class="mb-6 text-gray-700">Are you sure you want to end the test now? You will not be able to continue after confirming.</p>
            <div class="flex justify-end space-x-4">
                <button class="py-2 px-4 rounded-md font-semibold bg-gray-300 hover:bg-gray-400 text-gray-800" onclick="closeEndTestModal()">Cancel</button>
                <button class="py-2 px-4 rounded-md font-semibold bg-red-600 hover:bg-red-700 text-white" onclick="showReportModal()">End & View Report</button>
            </div>
        </div>
    </div>`;
}

function renderReportModal() {
    if (!isReportModalOpen) return '';

    let detailedResultsHtml = '';
    SKILL_ORDER.forEach(skill => {
        const answers = candidate.answers[skill] || {};
        const answerKeys = Object.keys(READING_CORRECT_ANSWERS);
        let score = 0;

        const cards = answerKeys.map(qId => {
            const answerValue = answers[qId] || '';
            const isCorrect = checkAnswer(qId, answerValue);
            if (isCorrect) score++;

            const displayAnswer = Array.isArray(answerValue) ? answerValue.join(', ') : answerValue;
            const displayCorrect = Array.isArray(READING_CORRECT_ANSWERS[qId])
                ? READING_CORRECT_ANSWERS[qId].join(', ')
                : READING_CORRECT_ANSWERS[qId];

            return `
                <div class="p-3 rounded border ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                    <p class="font-bold">${qId.toUpperCase()}</p>
                    <p><strong>Your Answer:</strong> ${displayAnswer || '-'}</p>
                    <p><strong>Correct Answer:</strong> ${displayCorrect}</p>
                    <p class="font-semibold mt-1 ${isCorrect ? 'text-green-600' : 'text-red-600'}">
                        ${isCorrect ? '✓ Correct' : '✗ Incorrect'}
                    </p>
                </div>`;
        }).join('');

        detailedResultsHtml += `
            <div>
                <h5 class="text-lg font-semibold text-[#f97316] mt-3 mb-2">${skill.toUpperCase()}</h5>
                <div class="space-y-3 p-4 bg-white ielts-border rounded-lg">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${cards}</div>
                    <div class="mt-4 pt-4 border-t text-xl font-bold text-center">
                        Total Score: ${score} / ${answerKeys.length}
                    </div>
                </div>
            </div>`;
    });

    return `
    <div class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col">
            <h3 class="text-2xl font-bold text-[#003366] mb-4 border-b pb-2">TEST RESULT REPORT</h3>
            <div class="space-y-4 text-sm mb-4 overflow-y-auto custom-scrollbar flex-grow">
                <div class="p-3 bg-gray-50 rounded-lg">
                    <p><strong>Candidate Code:</strong> ${candidate.code}</p>
                    <p><strong>Full Name:</strong> ${candidate.name}</p>
                    <p><strong>Test Status:</strong> Completed / Ended by user</p>
                </div>
                <h4 class="text-xl font-bold text-[#003366] mt-4 mb-2">REMAINING TIME</h4>
                <div class="grid grid-cols-1 gap-4 p-3 bg-gray-50 rounded-lg">
                    <p><strong>Reading:</strong> ${formatTime(candidate.times.reading)}</p>
                </div>
                <h4 class="text-xl font-bold text-[#003366] mt-4 mb-2">DETAILED RESULTS</h4>
                ${detailedResultsHtml}
            </div>
            <div class="flex justify-end space-x-4 sticky bottom-0 bg-white pt-4 border-t mt-auto">
                <button class="py-2 px-4 rounded-md font-semibold bg-blue-500 hover:bg-blue-600 text-white" onclick="handleCopyReport()">Copy Report</button>
                <button class="py-2 px-4 rounded-md font-semibold bg-gray-300 hover:bg-gray-400 text-gray-800" onclick="handleReset()">Close & Finish</button>
            </div>
        </div>
    </div>`;
}

/* ============================ SETUP SCREEN ============================ */
let setupError = '';

function renderSetupScreen() {
    return `
    <div class="fixed inset-0 bg-gray-100 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
            <h2 class="text-xl font-semibold text-center text-green-800 mb-2">APLUS FOREIGN LANGUAGE CENTRE</h2>
            <h1 class="text-3xl font-bold text-center text-[#003366] mb-6">PET READING MOCK TEST</h1>
            <p class="text-center text-gray-600 mb-6">Please enter candidate details to begin.</p>
            <div class="space-y-4">
                <div>
                    <label for="candidate-code" class="block text-sm font-medium text-gray-700">Candidate Code</label>
                    <input type="text" id="candidate-code" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-[#f97316] focus:border-[#f97316]" placeholder="e.g., APL0101" />
                </div>
                <div>
                    <label for="full-name" class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="full-name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-[#f97316] focus:border-[#f97316]" placeholder="e.g., Phan Ngoc Huy" />
                </div>
            </div>
            ${setupError ? `<p class="text-red-500 text-center mt-4">${setupError}</p>` : ''}
            <button onclick="handleSetupSubmit()" class="mt-8 w-full bg-[#f97316] text-white py-3 rounded-md font-bold hover:bg-[#e16913] transition-colors shadow-lg">
                START TEST
            </button>
            <button class="mt-4 text-xs text-gray-400 hover:text-red-500 underline mx-auto block" onclick="handleReset()">
                Clear Old Data & Restart
            </button>
        </div>
    </div>`;
}

function handleSetupSubmit() {
    const code = document.getElementById('candidate-code').value;
    const name = document.getElementById('full-name').value;
    if (!code.trim() || !name.trim()) {
        setupError = 'Please enter both Candidate Code and Full Name.';
        render();
        return;
    }
    setupError = '';
    handleStartTest(code, name);
}

/* ============================ MAIN RENDER ============================ */
function render() {
    if (appState === 'setup') {
        root.innerHTML = renderSetupScreen();
        return;
    }

    root.innerHTML = `
        <div class="app-container">
            ${renderHeader()}
            ${renderSkillTabs()}
            <main class="main-content">
                ${renderReadingContent()}
            </main>
        </div>
        ${renderEndTestModal()}
        ${renderReportModal()}
    `;
}

/* ============================ INIT ============================ */
loadState();
render();
</script>
</body>
</html>
