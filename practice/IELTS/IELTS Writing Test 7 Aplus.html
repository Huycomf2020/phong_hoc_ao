<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APLUS - IELTS WRITING MOCK TEST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            overflow-y: hidden;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        .app-container { display: flex; flex-direction: column; height: 100vh; max-height: 100vh; }
        .top-header { background-color: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; min-height: 60px; }
        .sub-header { background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 0.5rem 1.5rem; font-size: 14px; font-weight: 600; color: #334155; }
        .main-content { flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; }
        .split-pane { display: grid; grid-template-columns: 1fr; gap: 0; height: calc(100vh - 160px); }
        @media (min-width: 1024px) { .split-pane { grid-template-columns: 1fr 1fr; } }
        .pane-left, .pane-right { overflow-y: auto; padding: 1.5rem; background-color: #ffffff; height: 100%; border-right: 1px solid #e5e7eb; }
        .pane-right { background-color: #fafafa; border-right: none; display: flex; flex-direction: column; }
        textarea { flex-grow: 1; resize: none; font-size: 15px; line-height: 1.6; border: 1px solid #cbd5e1; border-radius: 0.375rem; padding: 1rem; width: 100%; height: calc(100% - 80px); }
        textarea:focus { outline: none; border-color: #f97316; }
        .bottom-nav { background-color: #ffffff; border-top: 1px solid #e5e7eb; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; min-height: 55px; }
        .nav-btn { padding: 0.5rem 1rem; font-weight: 600; border-radius: 0.375rem; cursor: pointer; border: 1px solid #cbd5e1; background-color: #ffffff; color: #334155; transition: all 0.2s; }
        .nav-btn.active { background-color: #10b981; color: white; border-color: #10b981; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnsrsVB7gzj_nugHJX_t2KJgfefljLNSeruBZhpxDQ-rk000eoN5qOpNaAagTl3Z3nHg/exec";
        const INITIAL_TIME = 60 * 60;

        const formatTime = (seconds) => {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return `${m} minutes left`;
        };

        const SetupScreen = ({ onStartTest, onClearData }) => {
            const [code, setCode] = useState('');
            const [name, setName] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = () => {
                if (!code.trim() || !name.trim()) {
                    setError('Vui lòng nhập đầy đủ Mã số Thí sinh / Lớp và Họ tên.');
                    return;
                }
                setError('');
                onStartTest(code, name);
            };

            return (
                <div className="fixed inset-0 bg-gray-100 flex items-center justify-center p-4 z-50">
                    <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
                        <h2 className="text-xl font-semibold text-center text-green-800 mb-2">APLUS FOREIGN LANGUAGE CENTRE</h2>
                        <h1 className="text-3xl font-bold text-center text-[#003366] mb-4">IELTS WRITING MOCK TEST</h1>
                        <p className="text-center text-xs text-red-600 mb-6 font-semibold">
                            ⚠️ Bài thi tự động chạy Fullscreen, chống bôi đen & chuột phải. Chuyển tab hoặc thoát Toàn màn hình sẽ bị ghi nhận vi phạm!
                        </p>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Mã số Thí sinh / Lớp</label>
                                <input 
                                    type="text" 
                                    value={code}
                                    onChange={(e) => setCode(e.target.value)}
                                    className="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-[#f97316] focus:border-[#f97316]" 
                                    placeholder="Ví dụ: APL001"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Họ và Tên Thí sinh</label>
                                <input 
                                    type="text" 
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-[#f97316] focus:border-[#f97316]" 
                                    placeholder="Ví dụ: Phan Ngọc Huy"
                                />
                            </div>
                        </div>
                        
                        {error && <p className="text-red-500 text-center mt-4 text-sm">{error}</p>}
                        
                        <button 
                            onClick={handleSubmit}
                            className="mt-8 w-full bg-[#f97316] text-white py-3 rounded-md font-bold hover:bg-[#e16913] transition-colors shadow-lg"
                        >
                            BẮT ĐẦU BÀI THI (FULLSCREEN)
                        </button>
                        <button 
                            className="mt-4 text-xs text-gray-400 hover:text-red-500 underline mx-auto block"
                            onClick={onClearData}
                        >
                            Clear Old Data & Restart
                        </button>
                    </div>
                </div>
            );
        };

        const TopHeader = ({ candidate, timeRemaining, onSubmitTest, warningCount }) => {
            return (
                <header className="top-header">
                    <div className="flex items-center space-x-4">
                        <span className="text-2xl font-extrabold text-[#0f172a] tracking-wider">APLUS</span>
                        <span className="text-sm font-medium text-gray-600">
                            Test taker ID: <strong className="text-gray-900">{candidate.code}</strong> ({candidate.name})
                        </span>
                        {warningCount > 0 && (
                            <span className="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded-full animate-pulse">
                                Warnings: {warningCount}
                            </span>
                        )}
                    </div>
                    <div className="flex items-center space-x-6">
                        <span className="text-sm font-bold text-gray-700">{formatTime(timeRemaining)}</span>
                        <button 
                            onClick={onSubmitTest}
                            className="bg-[#15803d] hover:bg-[#166534] text-white px-6 py-2 rounded font-bold text-sm shadow transition-colors"
                        >
                            Submit
                        </button>
                    </div>
                </header>
            );
        };

        const SubHeader = ({ currentTask }) => {
            return (
                <div className="sub-header flex items-center justify-between">
                    <div>
                        {currentTask === 'task1' ? (
                            <span>Writing Part 1 <span className="font-normal text-gray-500 ml-2">You should spend about 20 minutes on this task. Summarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.</span></span>
                        ) : (
                            <span>Writing Part 2 <span className="font-normal text-gray-500 ml-2">You should spend about 40 minutes on this task. Write at least 250 words.</span></span>
                        )}
                    </div>
                </div>
            );
        };

        const BottomNav = ({ currentTask, onSwitchTask }) => {
            return (
                <div className="bottom-nav">
                    <div className="flex items-center space-x-2">
                        <button 
                            className={`nav-btn ${currentTask === 'task1' ? 'active' : ''}`}
                            onClick={() => onSwitchTask('task1')}
                        >
                            Part 1
                        </button>
                        <button 
                            className={`nav-btn ${currentTask === 'task2' ? 'active' : ''}`}
                            onClick={() => onSwitchTask('task2')}
                        >
                            Part 2
                        </button>
                    </div>
                    <div className="flex items-center space-x-2">
                        <button 
                            onClick={() => onSwitchTask(currentTask === 'task1' ? 'task2' : 'task1')}
                            className="px-4 py-2 border rounded bg-white text-gray-700 hover:bg-gray-50 font-semibold text-sm"
                        >
                            {currentTask === 'task1' ? 'Next ➔' : '◄ Prev'}
                        </button>
                    </div>
                </div>
            );
        };

        const EndTestModal = ({ isOpen, onClose, onConfirm }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center p-4 z-50">
                    <div className="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg">
                        <h3 className="text-2xl font-bold text-[#003366] mb-4">Confirm Submission</h3>
                        <p className="mb-6 text-gray-700">Are you sure you want to finish the test and submit your essays for APLUS AI – IELTS WRITING Evaluation?</p>
                        <div className="flex justify-end space-x-4">
                            <button className="py-2 px-4 rounded-md font-semibold bg-gray-300 hover:bg-gray-400 text-gray-800" onClick={onClose}>Cancel</button>
                            <button className="py-2 px-4 rounded-md font-semibold bg-red-600 hover:bg-red-700 text-white" onClick={onConfirm}>Submit & Evaluate</button>
                        </div>
                    </div>
                </div>
            );
        };

        const ReportModal = ({ isOpen, onClose, candidate, answers, evaluationData, isSubmitting, submitStatus }) => {
            if (!isOpen) return null;

            const [activeTaskTab, setActiveTaskTab] = useState('task2');

            const t1Text = answers.task1 || '';
            const t2Text = answers.task2 || '';

            const evalResult = evaluationData || {
                t1Words: t1Text.trim() ? t1Text.trim().split(/\s+/).length : 0,
                t2Words: t2Text.trim() ? t2Text.trim().split(/\s+/).length : 0,
                t1Score: "6.0",
                t1TaskResponse: "Analyzing...",
                t1Coherence: "Analyzing...",
                t1Lexical: "Analyzing...",
                t1Grammar: "Analyzing...",
                t1Feedback: "Analyzing...",
                t2Score: "6.0",
                t2TaskResponse: "Analyzing...",
                t2Coherence: "Analyzing...",
                t2Lexical: "Analyzing...",
                t2Grammar: "Analyzing...",
                t2Feedback: "Analyzing...",
                overallScore: "6.0"
            };

            const activeEval = activeTaskTab === 'task1' ? {
                score: evalResult.t1Score,
                taskResponse: evalResult.t1TaskResponse,
                coherence: evalResult.t1Coherence,
                lexical: evalResult.t1Lexical,
                grammar: evalResult.t1Grammar,
                feedback: evalResult.t1Feedback,
                words: evalResult.t1Words,
                text: t1Text
            } : {
                score: evalResult.t2Score,
                taskResponse: evalResult.t2TaskResponse,
                coherence: evalResult.t2Coherence,
                lexical: evalResult.t2Lexical,
                grammar: evalResult.t2Grammar,
                feedback: evalResult.t2Feedback,
                words: evalResult.t2Words,
                text: t2Text
            };

            const handleDownloadPDF = () => {
                const element = document.getElementById('pdf-report-content');
                element.style.display = 'block';
                
                const opt = {
                    margin:       0.3,
                    filename:     `IELTS_Writing_Report_${candidate.code}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true, logging: false },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().from(element).set(opt).save().then(() => {
                    element.style.display = 'none';
                });
            };

            return (
                <div className="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center p-4 z-50">
                    <div className="bg-white p-6 rounded-xl shadow-2xl w-full max-w-5xl max-h-[92vh] flex flex-col">
                        <div className="flex justify-between items-center border-b pb-3">
                            <h3 className="text-2xl font-bold text-[#003366]">APLUS AI – IELTS WRITING REPORT</h3>
                            <div className="space-x-2">
                                <button 
                                    onClick={handleDownloadPDF}
                                    className="bg-orange-600 hover:bg-orange-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow transition-colors inline-flex items-center"
                                >
                                    📥 Download PDF Report
                                </button>
                                <span className="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1.5 rounded-full">APLUS AI Examiner</span>
                            </div>
                        </div>
                        
                        {isSubmitting && (
                            <div className="bg-blue-50 border border-blue-300 text-blue-700 px-4 py-2 rounded my-2 text-center font-medium animate-pulse">
                                🤖 APLUS AI is evaluating your essays according to Cambridge standards... Please wait!
                            </div>
                        )}
                        {submitStatus && (
                            <div className={`px-4 py-2 rounded my-2 text-center font-semibold ${
                                submitStatus.includes("thành công") || submitStatus.includes("Thành công") ? "bg-green-100 text-green-800 border border-green-300" : "bg-red-100 text-red-800 border border-red-300"
                            }`}>
                                {submitStatus}
                            </div>
                        )}

                        <div className="space-y-6 text-sm my-4 overflow-y-auto custom-scrollbar flex-grow pr-2 bg-white p-2">
                            <div className="p-5 bg-gradient-to-r from-slate-900 to-[#003366] text-white rounded-xl shadow grid grid-cols-2 md:grid-cols-4 gap-4 text-center items-center">
                                <div>
                                    <span className="block text-xs uppercase opacity-75">Candidate</span>
                                    <span className="font-bold text-base">{candidate.name} ({candidate.code})</span>
                                </div>
                                <div>
                                    <span className="block text-xs uppercase opacity-75">Word Count</span>
                                    <span className="font-bold text-base">T1: {evalResult.t1Words}w | T2: {evalResult.t2Words}w</span>
                                </div>
                                <div>
                                    <span className="block text-xs uppercase opacity-75">Task Bands</span>
                                    <span className="font-bold text-xl text-yellow-400">T1: {evalResult.t1Score} | T2: {evalResult.t2Score}</span>
                                </div>
                                <div className="bg-white/10 p-2 rounded-lg">
                                    <span className="block text-xs uppercase opacity-75">OVERALL WRITING</span>
                                    <span className="font-extrabold text-3xl text-[#f97316]">{evalResult.overallScore}</span>
                                </div>
                            </div>

                            <div className="flex border-b">
                                <button 
                                    className={`px-6 py-2.5 font-bold text-sm rounded-t-lg transition-colors ${activeTaskTab === 'task2' ? 'bg-[#003366] text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                                    onClick={() => setActiveTaskTab('task2')}
                                >
                                    Writing Task 2 Report (Band {evalResult.t2Score})
                                </button>
                                <button 
                                    className={`px-6 py-2.5 font-bold text-sm rounded-t-lg ml-2 transition-colors ${activeTaskTab === 'task1' ? 'bg-[#003366] text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                                    onClick={() => setActiveTaskTab('task1')}
                                >
                                    Writing Task 1 Report (Band {evalResult.t1Score})
                                </button>
                            </div>

                            <div className="space-y-4">
                                <h4 className="text-lg font-bold text-[#003366] border-l-4 border-[#f97316] pl-3">
                                    1. DETAILED FEEDBACK FOR {activeTaskTab.toUpperCase()}
                                </h4>
                                <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl mb-3">
                                    <p className="font-bold text-[#003366] mb-1">Overall Assessment:</p>
                                    <p className="text-gray-800 italic">{activeEval.feedback}</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl border">
                                    <div>
                                        <p className="font-bold text-blue-900 mb-1">Task Response / Achievement:</p>
                                        <p className="text-gray-700 bg-white p-3 rounded border mb-3">{activeEval.taskResponse}</p>
                                        
                                        <p className="font-bold text-blue-900 mb-1">Coherence & Cohesion:</p>
                                        <p className="text-gray-700 bg-white p-3 rounded border">{activeEval.coherence}</p>
                                    </div>
                                    <div>
                                        <p className="font-bold text-blue-900 mb-1">Lexical Resource:</p>
                                        <p className="text-gray-700 bg-white p-3 rounded border mb-3">{activeEval.lexical}</p>
                                        
                                        <p className="font-bold text-blue-900 mb-1">Grammatical Range & Accuracy:</p>
                                        <p className="text-gray-700 bg-white p-3 rounded border">{activeEval.grammar}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-2">
                                <h4 className="text-lg font-bold text-[#003366] border-l-4 border-slate-700 pl-3">
                                    2. CANDIDATE ESSAY ({activeTaskTab.toUpperCase()})
                                </h4>
                                <div className="p-4 bg-white border rounded-xl leading-relaxed text-gray-800 font-sans shadow-inner whitespace-pre-wrap">
                                    {activeEval.text || "(No submission)"}
                                </div>
                            </div>
                        </div>

                        {/* PDF EXPORT LAYOUT */}
                        <div id="pdf-report-content" style={{ display: 'none', background: '#ffffff', padding: '15px', color: '#000000' }}>
                            <div style={{ borderBottom: '3px solid #004d40', paddingBottom: '8px', marginBottom: '12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <div>
                                    <h2 style={{ color: '#004d40', margin: '0', fontSize: '20px', fontWeight: '800' }}>TRUNG TÂM NGOẠI NGỮ APLUS</h2>
                                    <p style={{ margin: '2px 0 0 0', fontSize: '10px', color: '#555' }}>International Foreign Language Centre</p>
                                </div>
                                <div style={{ textAlign: 'right' }}>
                                    <span style={{ background: '#e0f2f1', color: '#004d40', padding: '3px 8px', fontSize: '9px', fontWeight: 'bold', borderRadius: '4px' }}>OFFICIAL REPORT</span>
                                </div>
                            </div>

                            <div style={{ textAlign: 'center', marginBottom: '15px' }}>
                                <h1 style={{ fontSize: '18px', fontWeight: 'bold', color: '#003366', margin: '0' }}>IELTS WRITING REPORT</h1>
                                <p style={{ fontSize: '10px', color: '#666', margin: '2px 0 0 0' }}>Cambridge Academic Standard Evaluation</p>
                            </div>

                            <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', padding: '10px', borderRadius: '6px', marginBottom: '12px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', fontSize: '11px' }}>
                                <div><strong>Candidate Name:</strong> {candidate.name}</div>
                                <div><strong>Candidate Code / Class:</strong> {candidate.code}</div>
                                <div><strong>Task 1 Word Count:</strong> {evalResult.t1Words} words</div>
                                <div><strong>Task 2 Word Count:</strong> {evalResult.t2Words} words</div>
                            </div>

                            <div style={{ marginBottom: '12px' }}>
                                <h3 style={{ fontSize: '12px', color: '#003366', borderBottom: '1px solid #cbd5e1', paddingBottom: '3px', marginBottom: '6px' }}>Band Score Summary</h3>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', textAlign: 'center', fontSize: '11px' }}>
                                    <div style={{ background: '#f1f5f9', padding: '8px', borderRadius: '6px' }}>
                                        <div style={{ color: '#64748b', fontSize: '9px' }}>TASK 1 BAND</div>
                                        <div style={{ fontSize: '14px', fontWeight: 'bold', color: '#003366' }}>{evalResult.t1Score}</div>
                                    </div>
                                    <div style={{ background: '#f1f5f9', padding: '8px', borderRadius: '6px' }}>
                                        <div style={{ color: '#64748b', fontSize: '9px' }}>TASK 2 BAND</div>
                                        <div style={{ fontSize: '14px', fontWeight: 'bold', color: '#003366' }}>{evalResult.t2Score}</div>
                                    </div>
                                    <div style={{ background: '#fff7ed', padding: '8px', borderRadius: '6px', border: '1px solid #ffedd5' }}>
                                        <div style={{ color: '#c2410c', fontSize: '9px', fontWeight: 'bold' }}>OVERALL BAND</div>
                                        <div style={{ fontSize: '16px', fontWeight: 'extrabold', color: '#ea580c' }}>{evalResult.overallScore}</div>
                                    </div>
                                </div>
                            </div>

                            <div style={{ marginBottom: '12px' }}>
                                <h3 style={{ fontSize: '12px', color: '#003366', borderBottom: '1px solid #cbd5e1', paddingBottom: '3px', marginBottom: '6px' }}>Examiner & AI Evaluation Details</h3>
                                <div style={{ fontSize: '10px', lineHeight: '1.3', background: '#f8fafc', padding: '8px', borderRadius: '6px', border: '1px solid #e2e8f0' }}>
                                    <p style={{ margin: '0 0 4px 0' }}><strong>Task 1 Assessment:</strong> {evalResult.t1Feedback}</p>
                                    <p style={{ margin: '0' }}><strong>Task 2 Assessment:</strong> {evalResult.t2Feedback}</p>
                                </div>
                            </div>

                            <div style={{ marginBottom: '15px' }}>
                                <h3 style={{ fontSize: '12px', color: '#003366', borderBottom: '1px solid #cbd5e1', paddingBottom: '3px', marginBottom: '6px' }}>Candidate Essays Submission</h3>
                                <div style={{ marginBottom: '8px' }}>
                                    <h4 style={{ fontSize: '11px', color: '#334155', margin: '0 0 2px 0' }}>Task 1 Essay:</h4>
                                    <div style={{ fontSize: '9px', background: '#fff', border: '1px solid #cbd5e1', padding: '6px', borderRadius: '4px', whiteSpace: 'pre-wrap' }}>
                                        {t1Text || "(No submission)"}
                                    </div>
                                </div>
                                <div>
                                    <h4 style={{ fontSize: '11px', color: '#334155', margin: '0 0 2px 0' }}>Task 2 Essay:</h4>
                                    <div style={{ fontSize: '9px', background: '#fff', border: '1px solid #cbd5e1', padding: '6px', borderRadius: '4px', whiteSpace: 'pre-wrap' }}>
                                        {t2Text || "(No submission)"}
                                    </div>
                                </div>
                            </div>

                            <div style={{ borderTop: '2px dashed #cbd5e1', paddingTop: '10px', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', fontSize: '10px' }}>
                                <div>
                                    <p style={{ margin: '0 0 2px 0', color: '#64748b' }}>Verified by Aplus Foreign Language Centre</p>
                                    <p style={{ margin: '0', fontWeight: 'bold', color: '#004d40' }}>Official Academic Department</p>
                                </div>
                                <div style={{ textAlign: 'right' }}>
                                    <div style={{ border: '2px solid #004d40', color: '#004d40', display: 'inline-block', padding: '4px 10px', borderRadius: '4px', fontWeight: 'bold', fontSize: '10px', textTransform: 'uppercase', letterSpacing: '1px' }}>
                                        Certified & Verified
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-end space-x-4 pt-3 border-t mt-auto bg-white">
                            <button className="py-2.5 px-6 rounded-lg font-bold bg-[#003366] hover:bg-blue-900 text-white shadow" onClick={onClose}>Close & Complete</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [appState, setAppState] = useState('setup');
            const [candidate, setCandidate] = useState({ code: '', name: '' });
            const [currentTask, setCurrentTask] = useState('task1');
            const [answers, setAnswers] = useState({ task1: '', task2: '' });
            const [timeRemaining, setTimeRemaining] = useState(INITIAL_TIME);
            const [warningCount, setWarningCount] = useState(0);
            
            const [isEndModalOpen, setEndModalOpen] = useState(false);
            const [isReportModalOpen, setReportModalOpen] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState('');
            const [evaluationData, setEvaluationData] = useState(null);

            const timerInterval = useRef(null);

            useEffect(() => {
                const handleContextMenu = (e) => e.preventDefault();
                const handleSelectStart = (e) => e.preventDefault();
                const handleCopy = (e) => e.preventDefault();
                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('selectstart', handleSelectStart);
                document.addEventListener('copy', handleCopy);
                return () => {
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('selectstart', handleSelectStart);
                    document.removeEventListener('copy', handleCopy);
                };
            }, []);

            useEffect(() => {
                if (appState !== 'testing') return;
                const handleVisibilityChange = () => {
                    if (document.hidden) setWarningCount(prev => prev + 1);
                };
                const handleFullscreenChange = () => {
                    if (!document.fullscreenElement) setWarningCount(prev => prev + 1);
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                };
            }, [appState]);

            const pauseTimer = useCallback(() => {
                if (timerInterval.current) {
                    clearInterval(timerInterval.current);
                    timerInterval.current = null;
                }
            }, []);

            const runTimer = useCallback(() => {
                if (timerInterval.current) return;
                timerInterval.current = window.setInterval(() => {
                    setTimeRemaining(prev => (prev > 0 ? prev - 1 : 0));
                }, 1000);
            }, []);

            const submitAndEvaluateWithGemini = useCallback(async (currentCandidate, currentAnswers, warnings) => {
                setIsSubmitting(true);
                setSubmitStatus('');
                
                const payload = {
                    sheetName: "IELTS Writing",
                    testType: "IELTS WRITING MOCK TEST (APLUS AI Real)",
                    candidateCode: currentCandidate.code,
                    candidateName: currentCandidate.name,
                    task1Text: currentAnswers.task1 || "",
                    task2Text: currentAnswers.task2 || "",
                    warningCount: warnings
                };

                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    if (result.status === "success" && result.evaluation) {
                        setEvaluationData(result.evaluation);
                        setSubmitStatus('✅ Aplus AI evaluated successfully and saved to Google Sheets!');
                    } else {
                        setSubmitStatus('⚠️ Data saved but AI response format was unexpected.');
                    }
                } catch (err) {
                    console.error("API error:", err);
                    setSubmitStatus('❌ Failed to connect to AI server. Please check your network.');
                } finally {
                    setIsSubmitting(false);
                }
            }, []);

            const showReportModal = useCallback(() => {
                pauseTimer();
                setEndModalOpen(false);
                setReportModalOpen(true);
                submitAndEvaluateWithGemini(candidate, answers, warningCount);
            }, [pauseTimer, submitAndEvaluateWithGemini, candidate, answers, warningCount]);

            useEffect(() => {
                if (timeRemaining <= 0 && appState === 'testing') {
                    pauseTimer();
                    showReportModal();
                }
            }, [timeRemaining, appState, pauseTimer, showReportModal]);

            const handleStartTest = (code, name) => {
                setCandidate({ code, name });
                setAppState('testing');
                runTimer();
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            };

            const handleSaveAnswer = (taskKey, value) => {
                setAnswers(prev => ({ ...prev, [taskKey]: value }));
            };

            const handleReset = () => {
                pauseTimer();
                setCandidate({ code: '', name: '' });
                setAnswers({ task1: '', task2: '' });
                setTimeRemaining(INITIAL_TIME);
                setAppState('setup');
                setReportModalOpen(false);
                window.location.reload();
            };

            if (appState === 'setup') {
                return <SetupScreen onStartTest={handleStartTest} onClearData={handleReset} />;
            }

            const currentText = answers[currentTask] || '';
            const wordCount = currentText.trim() ? currentText.trim().split(/\s+/).filter(Boolean).length : 0;

            return (
                <div className="app-container">
                    <TopHeader 
                        candidate={candidate}
                        timeRemaining={timeRemaining}
                        onSubmitTest={() => setEndModalOpen(true)}
                        warningCount={warningCount}
                    />
                    <SubHeader currentTask={currentTask} />
                    <main className="main-content">
                        <div className="split-pane">
                            <div className="pane-left custom-scrollbar">
                                <h3 className="text-lg font-bold text-gray-900 mb-3">
                                    {currentTask === 'task1' ? 'Task 1 Diagram & Instructions' : 'Task 2 Prompt'}
                                </h3>
                                {currentTask === 'task1' ? (
                                    <div className="space-y-4 text-gray-800 text-sm">
                                        
                                        <div className="my-4">
                                            <img src="https://i.ibb.co/TqHqZW8d/I-W-t7.png" alt="Task 1 Chart" className="w-full rounded border shadow-sm" />
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-4 text-gray-900 text-sm leading-relaxed">
                                        <p className="font-semibold text-base text-gray-900">
                                            Some people think that newspapers are the best way to learn about news. However, others believe that they can learn news more effectively through other media.
                                        </p>
                                        <p>Discuss both views and give your own opinion.</p>
                                        <p className="text-gray-800 italic mt-4">
                                            Give reasons for your answer and include any relevant examples from your own knowledge or experience.
                                        </p>
                                    </div>
                                )}
                            </div>

                            <div className="pane-right">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="font-bold text-sm text-gray-700">Your Response ({currentTask.toUpperCase()})</span>
                                    <span className="text-xs font-semibold text-orange-600">Word Count: {wordCount} words</span>
                                </div>
                                <textarea
                                    className="custom-scrollbar"
                                    placeholder={`Type your response for ${currentTask.toUpperCase()} here...`}
                                    value={currentText}
                                    onChange={(e) => handleSaveAnswer(currentTask, e.target.value)}
                                ></textarea>
                                <div className="mt-2 text-xs text-gray-500">
                                    {currentTask === 'task1' ? 'Target: At least 150 words' : 'Target: At least 250 words'}
                                </div>
                            </div>
                        </div>
                    </main>
                    <BottomNav currentTask={currentTask} onSwitchTask={setCurrentTask} />

                    <EndTestModal isOpen={isEndModalOpen} onClose={() => setEndModalOpen(false)} onConfirm={showReportModal} />
                    <ReportModal isOpen={isReportModalOpen} onClose={handleReset} candidate={candidate} answers={answers} evaluationData={evaluationData} isSubmitting={isSubmitting} submitStatus={submitStatus} />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
