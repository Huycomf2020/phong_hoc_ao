<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APLUS - IELTS Reading Test 2</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            /* Chống bôi đen văn bản */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* IELTS IDP Dark Green Header */
        .aplus-brand {
            color: #0f5132;
            font-weight: 900;
            font-size: 1.35rem;
            letter-spacing: -0.5px;
        }

        .header-top {
            height: 52px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 20;
        }

        .part-header-banner {
            background-color: #f0f2f5;
            border-bottom: 1px solid #e0e0e0;
            padding: 0.6rem 1.5rem;
            font-size: 0.95rem;
            color: #333;
        }

        /* Split Screen Area */
        .main-workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .passage-pane {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
        }

        .divider-handle {
            width: 14px;
            background: #e8ecef;
            border-left: 1px solid #d1d5db;
            border-right: 1px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: col-resize;
            color: #666;
            font-size: 10px;
        }

        .questions-pane {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: #ffffff;
        }

        /* Footer Test Navigation */
        .test-footer {
            height: 60px;
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            z-index: 20;
        }

        .nav-part-btn {
            padding: 4px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4b5563;
            border-radius: 4px;
            cursor: pointer;
        }

        .nav-part-btn.active {
            color: #0f5132;
            background-color: #e8f5e9;
        }

        .q-square {
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid #d1d5db;
            border-radius: 3px;
            background: #fff;
            color: #374151;
            cursor: pointer;
            margin: 0 1px;
        }

        .q-square.answered {
            background-color: #e5e7eb;
            font-weight: 700;
            border-color: #9ca3af;
        }

        .q-square.active {
            border: 2px solid #0f5132;
            color: #0f5132;
            font-weight: 700;
        }

        /* Custom Scrollbars */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        /* Radio option styling like IDP */
        .idp-radio-label {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .idp-radio-label:hover {
            background-color: #f3f4f6;
        }
        .idp-radio-label input[type="radio"] {
            margin-right: 12px;
            accent-color: #0f5132;
            width: 16px;
            height: 16px;
        }
    </style>
    <!-- React CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnsrsVB7gzj_nugHJX_t2KJgfefljLNSeruBZhpxDQ-rk000eoN5qOpNaAagTl3Z3nHg/exec";

        // Đáp án chuẩn 40 câu từ test 2_with_answer.pdf
        const READING_CORRECT_ANSWERS = {
            'r_q1': 'NOT GIVEN',
            'r_q2': 'FALSE',
            'r_q3': 'TRUE',
            'r_q4': 'TRUE',
            'r_q5': 'FALSE',
            'r_q6': 'NOT GIVEN',
            'r_q7': 'FALSE',
            'r_q8': '29 centimeters',
            'r_q9': 'rocks',
            'r_q10': 'bill',
            'r_q11': 'day',
            'r_q12': 'plovers',
            'r_q13': 'poison',
            'r_q14': 'G',
            'r_q15': 'E',
            'r_q16': 'A',
            'r_q17': 'J',
            'r_q18': 'C',
            'r_q19': 'D',
            'r_q20': 'G',
            'r_q21': 'A',
            'r_q22': 'E',
            'r_q23': 'FALSE',
            'r_q24': 'TRUE',
            'r_q25': 'FALSE',
            'r_q26': 'NOT GIVEN',
            'r_q27': 'YES',
            'r_q28': 'NOT GIVEN',
            'r_q29': 'NOT GIVEN',
            'r_q30': 'NO',
            'r_q31': 'beans',
            'r_q32': 'group',
            'r_q33': 'match',
            'r_q34': 'untrue',
            'r_q35': 'anxious',
            'r_q36': 'Asch',
            'r_q37': 'Internalization',
            'r_q38': 'valid',
            'r_q39': 'Identification',
            'r_q40': 'teenagers'
        };

        const calculateIELTSBand = (correct) => {
            if (correct >= 39) return "9.0";
            if (correct >= 37) return "8.5";
            if (correct >= 35) return "8.0";
            if (correct >= 33) return "7.5";
            if (correct >= 30) return "7.0";
            if (correct >= 27) return "6.5";
            if (correct >= 23) return "6.0";
            if (correct >= 19) return "5.5";
            if (correct >= 15) return "5.0";
            if (correct >= 13) return "4.5";
            if (correct >= 10) return "4.0";
            if (correct >= 8)  return "3.5";
            if (correct >= 6)  return "3.0";
            if (correct >= 4)  return "2.5";
            return "2.0";
        };

        const checkAnswer = (qId, value) => {
            const correct = READING_CORRECT_ANSWERS[qId];
            if (!correct) return false;
            return String(value || '').trim().toLowerCase() === String(correct).trim().toLowerCase();
        };

        // Form đăng nhập ban đầu
        const SetupScreen = ({ onStartTest }) => {
            const [code, setCode] = useState('');
            const [name, setName] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = () => {
                if (!code.trim() || !name.trim()) {
                    setError('Vui lòng nhập đầy đủ Mã thí sinh/Lớp và Họ tên.');
                    return;
                }
                onStartTest(code, name);
            };

            return (
                <div className="fixed inset-0 bg-gray-100 flex items-center justify-center p-4 z-50">
                    <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-[#0f5132]">
                        <h2 className="text-xl font-bold text-center text-[#0f5132] mb-1">APLUS LANGUAGE CENTER</h2>
                        <h1 className="text-2xl font-black text-center text-gray-800 mb-4">IELTS READING PRACTICE TEST 2</h1>
                        <p className="text-xs text-red-600 mb-6 text-center font-medium">
                            ⚠️ Hệ thống sẽ bật Fullscreen, khóa chuột phải và chống copy. Vi phạm chuyển tab sẽ bị ghi nhận!
                        </p>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700">Mã số Thí sinh / Lớp</label>
                                <input 
                                    type="text" 
                                    value={code}
                                    onChange={(e) => setCode(e.target.value)}
                                    className="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-[#0f5132] focus:border-[#0f5132]" 
                                    placeholder="Ví dụ: 12A1 / APLUS102"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700">Họ và Tên Thí sinh</label>
                                <input 
                                    type="text" 
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-[#0f5132] focus:border-[#0f5132]" 
                                    placeholder="Ví dụ: Phan Ngọc Huy"
                                />
                            </div>
                        </div>
                        
                        {error && <p className="text-red-500 text-xs mt-3 text-center">{error}</p>}
                        
                        <button 
                            onClick={handleSubmit}
                            className="mt-6 w-full bg-[#0f5132] text-white py-3 rounded-md font-bold hover:bg-[#0b3d26] transition-colors shadow-md"
                        >
                            START TEST (FULLSCREEN)
                        </button>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [appState, setAppState] = useState('setup');
            const [candidate, setCandidate] = useState({ code: '', name: '' });
            const [answers, setAnswers] = useState({});
            const [currentPart, setCurrentPart] = useState(1);
            const [timeLeft, setTimeLeft] = useState(60 * 60);
            const [warningCount, setWarningCount] = useState(0);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState('');

            // Chống chuột phải & Bôi đen
            useEffect(() => {
                const handleContextMenu = (e) => e.preventDefault();
                const handleSelectStart = (e) => e.preventDefault();
                const handleCopy = (e) => e.preventDefault();

                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('selectstart', handleSelectStart);
                document.addEventListener('copy', handleCopy);

                return () => {
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('selectstart', handleSelectStart);
                    document.removeEventListener('copy', handleCopy);
                };
            }, []);

            // Cảnh báo vi phạm rời màn hình
            useEffect(() => {
                if (appState !== 'testing' || isSubmitted) return;

                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        setWarningCount(prev => {
                            const newCount = prev + 1;
                            alert(`⚠️ CẢNH BÁO VI PHẠM (${newCount}): Bạn vừa chuyển tab hoặc rời khỏi bài thi!`);
                            return newCount;
                        });
                    }
                };

                const handleFullscreenChange = () => {
                    if (!document.fullscreenElement) {
                        setWarningCount(prev => {
                            const newCount = prev + 1;
                            alert(`⚠️ CẢNH BÁO VI PHẠM (${newCount}): Bạn đã thoát khỏi chế độ Toàn màn hình!`);
                            return newCount;
                        });
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                document.addEventListener('fullscreenchange', handleFullscreenChange);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                };
            }, [appState, isSubmitted]);

            // Timer countdown
            useEffect(() => {
                if (appState !== 'testing' || isSubmitted) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleSubmitTest();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [appState, isSubmitted]);

            const handleStartTest = (code, name) => {
                setCandidate({ code, name });
                setAppState('testing');
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                }
            };

            const handleAnswerChange = (qId, val) => {
                setAnswers(prev => ({ ...prev, [qId]: val }));
            };

            const countPartAnswered = (start, end) => {
                let cnt = 0;
                for (let i = start; i <= end; i++) {
                    if (answers[`r_q${i}`] && String(answers[`r_q${i}`]).trim() !== '') {
                        cnt++;
                    }
                }
                return cnt;
            };

            // Nộp bài & gửi dữ liệu lên Google Sheet
            const handleSubmitTest = async () => {
                const totalAnswered = Object.keys(answers).filter(k => String(answers[k]).trim() !== '').length;
                if (totalAnswered < 40 && !confirm(`Bạn mới làm ${totalAnswered}/40 câu. Bạn có chắc chắn muốn nộp bài?`)) {
                    return;
                }

                setIsSubmitted(true);
                setIsSubmitting(true);

                let correctCount = 0;
                Object.keys(READING_CORRECT_ANSWERS).forEach(qId => {
                    if (checkAnswer(qId, answers[qId])) correctCount++;
                });

                const bandScore = calculateIELTSBand(correctCount);

                const payload = {
                    sheetName: "IELTS TESTS",
                    testType: "IELTS TESTS - TEST 2",
                    candidateCode: candidate.code,
                    candidateName: candidate.name,
                    correctCount: `${correctCount}/40`,
                    score: bandScore,
                    warningCount: warningCount
                };

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    setSubmitStatus('✅ Đã gửi kết quả thành công lên Google Sheets!');
                } catch (err) {
                    setSubmitStatus('❌ Lỗi gửi dữ liệu. Vui lòng chụp lại màn hình kết quả!');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const formatMinutesLeft = (seconds) => {
                const m = Math.floor(seconds / 60);
                return `${m} minutes left`;
            };

            if (appState === 'setup') {
                return <SetupScreen onStartTest={handleStartTest} />;
            }

            return (
                <div className="h-screen flex flex-col">
                    {/* Header chuẩn IDP với Logo APLUS màu dark green */}
                    <header className="header-top">
                        <div className="flex items-center space-x-6">
                            <div className="aplus-brand">APLUS</div>
                            <div className="text-xs text-gray-600">
                                Test taker ID: <span className="font-semibold text-gray-800">{candidate.code} ({candidate.name})</span>
                            </div>
                        </div>

                        <div className="font-semibold text-sm text-gray-700">
                            {formatMinutesLeft(timeLeft)}
                        </div>

                        <div className="flex items-center space-x-3">
                            {warningCount > 0 && (
                                <span className="text-xs bg-red-100 text-red-700 px-2 py-1 rounded font-bold border border-red-300">
                                    Cảnh báo: {warningCount}
                                </span>
                            )}
                            <button className="p-1.5 text-gray-600 hover:bg-gray-100 rounded">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                            </button>
                            <button 
                                onClick={handleSubmitTest}
                                className="bg-[#0f5132] hover:bg-[#0b3d26] text-white text-xs font-bold px-4 py-2 rounded shadow-sm transition-colors"
                            >
                                Submit
                            </button>
                        </div>
                    </header>

                    {/* Part Banner Header */}
                    <div className="part-header-banner font-medium">
                        Reading Part {currentPart}
                        <span className="text-xs text-gray-500 ml-2">Read the passage and answer questions {currentPart === 1 ? '1–13' : currentPart === 2 ? '14–26' : '27–40'}.</span>
                    </div>

                    {/* Split Screen Workspace */}
                    <div className="main-workspace">
                        {/* Cột trái: Passage */}
                        <div className="passage-pane custom-scrollbar">
                            {currentPart === 1 && (
                                <div>
                                    <h1 className="text-xl font-bold text-gray-900 mb-2 text-center">A SURVIVOR'S STORY</h1>
                                    <p className="italic text-sm text-gray-600 mb-6 text-center">One native bird in New Zealand that has managed to survive the introduction of non-native species</p>
                                    <div className="space-y-4 text-sm text-gray-800 leading-relaxed">
                                        <p>As an island country with a fauna dominated by birds. New Zealand was once home to an owl species which is now extinct, the laughing owl, named for its distinctive cry. This bird was widespread throughout the islands when European settlers arrived in the middle of the 19th century and it remained in good numbers for some years thereafter. Where other native birds suffered from predation by the Polynesian rat, the laughing turned the tables and adapted its diet to include the rodent. It was also capable of catching and killing the other New Zealand owl, the Morepork, and even larger birds, such as the weka. However, the laughing owl was wiped out around the beginning of the 20th century. Its demise caused by specimen collectors, habitat changes, and non-native predators including cats and stoats. Surprisingly, it is the smaller owl, the morepork, that has managed to survive until this day.</p>
                                        <p>Speckled dark brown, with yellow eyes and long tails, they are around 29 centimeters long from head to tail and 175 grams in weight. Moreporks have fringes on the edge of their feathers, so they can fly almost silently and not alert potential prey. They have acute hearing and their large eyes are very sensitive to light.</p>
                                        <p>Moreporks nest in tree hollows, in clumps of plants, or in cavities among rocks and roots, in the wild, moreporks usually start nesting in October, although zoo specimens have been recorded nesting in midwinter, possibly stimulated by an ample food supply. The female lays up to three white eggs, which she incubates for 20 to 30 days. During this time, she rarely hunts, and the male brings food to her. Once the chicks hatch, she stays mainly on the nest until the young owls are fully feathered. When hatched chicks are covered in light grey down, and have their eyes closed. The eyes do not open until the eighth day after hatching. They can fly at around 35 days.</p>
                                        <p>By day, moreporks sleep in roots. By night, they hunt a variety of animals - mainly large invertebrates including the scarab and huhu beetles, months, caterpillars and spiders. They also take mall birds and mice. They can find suitable food in pine forests as well as native forest. A morepork uses its sharp talons to catch or stun its prey, which it then carries away in its bill. Moreporks are clever hunters, and birds such as robins, grey warblers and fantails can end up as their prey. In the day, these small birds sometimes mob drowsy moreporks and chase them away from their roosts. They force the sleepy predators to search for a more peaceful spot.</p>
                                        <p>Moreporks have proved to be ungracious hosts. Scientists trying to establish a population of plovers on Motuora island in New Zealand's Hauraki Gulf were mystified as to why only two birds survived out of 75 placed there. The culprits turned out to be five pairs of Moreporks that ate or chased away the new arrivals.</p>
                                        <p>Although moreporks are still considered to be relatively common, it is likely that numbers are in gradual decline due to predation and loss of habitat. As the female is a hole-nester, she vulnerable to predators such as stoats and possums during the breeding season, and eggs and chicks are also be at risk from rats. The use of pesticides is another possible threat to the owls though not a direct one. As moreporks are at the top of the food chain, they could be affected by an accumulative poison by consuming prey that has ingested poison.</p>
                                        <p>The New Zealand Department of Conservation is taking steps to ensure the preservation of New Zealand's only native owl. The department is involved in measuring the population of moreporks and has put transmitters on a number of birds to determine survival and mortality. As well as being New Zealand's only native owl, the morepork has symbolic and spiritual importance, so in monitoring the birds is hoped that the morepork will continue to survive and thrive.</p>
                                        <p>At dusk, the melancholy sound of the morepork can be heard in forests and parks as it calls toother moreporks and claims territory. Its Maori name (ruru) echoes its two-part cry, in the tradition of the Maori people of New Zealand, the morepork, or ruru, was often seen as a careful guardian. A number of sayings referred to the bird's alertness. As a bird of the night, it was associated with the spirit world. Moreporks were believed to act as messengers to the gods in the heavens, flying along spiritual paths in the sky. They were the mediums used to communicate with the gods. The occasional high, piercing call of the morepork signified bad news, but the lower-pitched and more common 'ruru' call heralded good news.</p>
                                    </div>
                                </div>
                            )}

                            {currentPart === 2 && (
                                <div>
                                    <h1 className="text-xl font-bold text-gray-900 mb-2 text-center">IDEAL HOMES</h1>
                                    <p className="italic text-sm text-gray-600 mb-6 text-center">New ideas and some old ones</p>
                                    <div className="space-y-4 text-sm text-gray-800 leading-relaxed">
                                        <p><strong>A.</strong> The traditional kampung houses of Malaysia do not need air-conditioning. Built on stilts and with steep roofs, they have year-round ventilation. The raised structure ensures a cooling breeze comes up through the floorboards, while the high roof acts as a chimney to release hot air. The airtight, concrete boxes of modern city construction, in contrast, are heat traps, says Muhammad Peter Davis of University Putra Malaysia. He has calculated that typical modem Malaysian houses are 5°C hotter than the air outside. 'The builders of kampung houses had no knowledge of modern science or engineering but they came up with the perfect design,' says Davis.</p>
                                        <p><strong>B.</strong> This story of ancient architectural sophistication and modern insanity is repeated around the world. In the name of modernism, people have thrown away architecture designed to cope with the environment in which they live, and adopted house designs originating from cold, northern environments, where the idea is to keep heat in.</p>
                                        <p><strong>C.</strong> Once, the aim of architectural modernists was to build structures that kept nature out and to replace it with air-conditioning. Now they are learning that they cannot do that effectively. Slowly, they are seeing the benefit of working with nature, rather than against it. In California, they probably use more power for air-conditioning than anywhere else on Earth. According to Arthur Rosenfeld from the University of California, what California needs is white paint. If Los Angeles painted its roofs white, planted trees to shade buildings, and chose lighter-colored paving, it could reduce city temperatures by 3°C and cut the annual air-conditioning bill by $170 million a year.</p>
                                        <p><strong>D.</strong> Modern buildings are greedy in their use of energy. Much is made of the contribution of transportation to global warming, through its emissions of greenhouse gases. But, globally, transportation is responsible for just 22 per cent of carbon dioxide emissions. The building sector is responsible for 31 per cent, mostly the result of heating and air conditioning systems. In developing countries, where demand for electricity for buildings is rising by 5 per cent a year, the biggest demand is for air-conditioning in modem buildings which are often designed to cope with every different climatic condition.</p>
                                        <p><strong>E.</strong> Before air-conditioning, much of the Arab world kept cool through thoughtful building design. Many buildings were built according to the principles of the wind tower, a tall structure with vertical vents at the top that open in all dictions to catch any passing breeze. Typically, these wind tower buildings were made of local materials such as stone, mud brick, wood and palm tree fronds. The buildings were inward-looking, which served the dual function of focusing attention to the courtyard, where family members spend time together, and protecting living areas from the rays of the sun.</p>
                                        <p><strong>F.</strong> Throughout the Middle East today, wind towers are often little more than museum piece. But there are exceptions. Jordan has won awards for the architecture of a village on the shores of the Red Sea, which is designed to conserve energy. Made of rough, local stone in a traditional style, it combines the ventilation system of the wind towers for summer coolness with up-to-date heating and floor insulation to protect against the desert cold in winter.</p>
                                        <p><strong>G.</strong> Traditional building materials, like traditional building designs, are being rediscovered by those looking for low-energy solutions to the current construction needs. Clay is one such material: As the Dutch housing contractor R van der Ley has argued in promoting a series of clay housing projects in developing countries, clay has many benefits over its industrialized version, brick. Clay blocks cost only half as much as ordinary bricks. Clay also generates work because people can find it, mould it, bake it and work it themselves. Two hundred clay bricks can be made with the fuel oil that makes just one ordinary brick. Moreover, clay is an excellent insulator against both cold and heat outside and can easily be recycled.</p>
                                        <p><strong>H.</strong> But although traditional methods and materials can be revived in appropriate settings, new green, low-energy technologies are needed, especially in urban environments. The thermal insulation of homes in cold countries is an example. In 1983, Sweden adopted a national standard, requiring the country's homes to loge no more than 60 kilowatt hours per square more over the year. To meet that standard, windows were double glazed, and walls and roofs insulated. Every home became a fortress against the cold and outside. Unfortunately, the rest of Europe has not followed the lead.</p>
                                        <p><strong>I.</strong> In the United States, Amory Lovins has promoted a range of low-energy technologies: 'superwindows', for example, which let in invisible light but can be 'tuned' either allow in, or reflect away, infrared solar radiation the stuff that heats. Buildings with large expanses of window (and big energy bills) can be designed to achieve optimum temperatures.</p>
                                        <p><strong>J.</strong> As well as more efficient use of energy, the word also needs new sources of renewable power. Solar energy is being tried out in the developing world, in villages often far from electricity grids. The world's biggest solar power installation got underway in the Philippines, in 2001, where a project commenced to install solar panels for 400,000 peple in 150 villages. Such projects are demonstrating that countries, whether developing or developed, no longer need huge national grids to supply electricity. Every home can do its own thing with the help of a solar panel and a storage battery.</p>
                                        <p><strong>K.</strong> Houses of course, are more than machines for living in. They are social and psychological spaces, too. Future houses may not look exactly like kampungs or wind towers or any other traditional models. But to work for us and for our environment, they have to suit us as well as these traditional forms did.</p>
                                    </div>
                                </div>
                            )}

                                    <h1 className="text-xl font-bold text-gray-900 mb-2 text-center">CONFORMITY</h1>
                                    <p className="italic text-sm text-gray-600 mb-6 text-center">A review of conformity and some of the studies that have been done on it</p>
                                    <div className="space-y-4 text-sm text-gray-800 leading-relaxed">
                                        <p>During your childhood, there will have been some kind of craze which affected all the people in your school It may have been to do with a particular toy or possibly a must-have item of clothing. I may have been something as simple as a type of pen or as expensive as an electronic games console. Fashion designers, toy manufacturers and anyone else involved in the retail trade love conformity. Set up a craze, especially in the young and everyone will go for it. In fact, it's an ideal way to sell huge quantities of merchandise. The levels of conformity in consumerism are phenomenal. When you actually stand back and consider how easily we are persuaded that having certain items is the only way we can ensure peace of mind, you see what an important concept conformity is.</p>
                                        <p>Conformity has been described as 'yielding to group pressure' (Crutchfield 1962). However, this implies that other people put pressure on us to make us conform and this is not always the case. A better definition is given by Aronson (1976) who said it was 'a change in a person's behaviour or opinions as a result of real or imagined pressure from a person or group of people. This would make more sense, as often the pressure we feel imagined. The person or group he refers to would have to be important to us at the time, regardless of their status.</p>
                                        <p>There has been considerable research on conformity. One of the first studies looked at the answers people gave when asked to estimate the number of beans in a bottle (Jennes, 1932). If you have ever entered a 'guess the number' competition, you probably looked at the previous estimates made and based your judgment on what other people had guessed. This is more or less what happened in the Jennes study. First of all, he asked the respondents to give their own estimates, and then he asked them to decide a group estimate, Finally, he asked them alone again and discovered that they had stayed with the group answer.</p>
                                        <p>Probably the most famous study on conformity was undertaken by Asch (1951) when he created a situation where many of his subjects gave answers which were blatantly untrue, rather than contradict the people they were with. He did this by getting his subject to sit round a table with six stooges (colleagues of the experimenter) so that the subject was second to last. He showed them all a large card which had three lines of different lengths drawn on it, labelled A, B and C. He then gave them a C card with a single line and asked them to match this in terms of length to one of the lines A, B or C.</p>
                                        <p>The stooges gave untrue responses in a number of the trials and the subjects were left in the situation where they either reported what they saw with their own eyes or conformed to the norm of the group. When the results were assessed, Asch found that in one out of every three trials where the wrong answer was given, the subject gave the same wrong answer as the stooges. This led to an average level of conformity of 32 per cent. Asch interviewed his subjects after the trials to try to find out why they conformed to an answer which was so obviously wrong. Most of them said that they did not want to cause problems within the group, although they falsehearted that when they did give wrong answers it made them anxious. (Asch found that when there was just one other person present who did not go along with the majority, no matter how many others there were, it was sufficient to make the subject give the right answer).</p>
                                        <p>Kelman (1953) outlined three processes which can explain social conformity The first is compliance where subjects go along with the crowd to prevent any in-group hostility or bad feeling and to maintain group harmony. However, they do not change their own private belief. If we look back to the Asch study, we can see that the subjects were simply complying with the demands of the experimental situation but hadn't actually internalized the group's norms. They agreed in public, but dissented in private. In a process known as internalization, however, subjects do actually see the view of the group as the more valid one. They may be able to do this, for example, by convincing themselves that their eyesight is poor. Sometimes, however, subjects actually seem to change their beliefs because they want to become more like their heroes. If they really want to become part of an in-group, they will start to identify with that group and take on the group's values and beliefs, even if they are different to their own. Kelman calls this identification. It frequently happens with teenagers who want to become more like a peer group in order to be accepted, and suddenly seem to go against all the values and beliefs of parents.</p>
                                        <p>So why is it that we have to conform? Some people feel confident most of the time, have high self-esteem and do not have to go along with the majority. For most of us, though, how confident we feel varies from day to day, depending on the situation we are in, and this can influence behaviour.</p>
