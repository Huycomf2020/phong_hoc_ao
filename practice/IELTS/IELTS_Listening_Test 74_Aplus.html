<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APLUS - IELTS Listening Test 74</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .questions-pane {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        .aplus-brand {
            color: #0f5132;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        .header-top {
            height: 56px;
            background: #ffffff;
            border-bottom: 1px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 20;
        }

        .part-header-banner {
            background-color: #f3f4f6;
            border-bottom: 1px solid #e5e7eb;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            color: #1f2937;
            font-weight: 500;
        }

        .main-workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .questions-pane {
            flex: 1;
            overflow-y: auto;
            padding: 2.5rem;
            background: #ffffff;
            position: relative;
        }

        .ielts-highlight {
            background-color: #70384a;
            color: #ffffff;
            padding: 0 2px;
            border-radius: 2px;
            cursor: pointer;
        }

        .idp-popover {
            position: absolute;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            z-index: 100;
            padding: 4px;
        }

        .idp-popover-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            font-size: 0.75rem;
            color: #4b5563;
            font-weight: 500;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .idp-popover-btn:hover {
            background-color: #f3f4f6;
            color: #111827;
        }

        .test-footer {
            height: 60px;
            background: #ffffff;
            border-top: 1px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 20;
        }

        .nav-part-btn {
            padding: 6px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
            border: none;
        }

        .nav-part-btn.active {
            color: #0f5132;
            background-color: #e8f5e9;
        }

        .q-square {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid #9ca3af;
            border-radius: 3px;
            background: #fff;
            color: #374151;
            cursor: pointer;
            margin: 0 2px;
        }

        .q-square.answered {
            background-color: #e5e7eb;
            font-weight: 700;
            border-color: #6b7280;
        }

        .q-square.active {
            border: 2px solid #0f5132;
            color: #0f5132;
            font-weight: 700;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }

        .idp-radio-label {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .idp-radio-label:hover {
            background-color: #f3f4f6;
        }
        .idp-radio-label input[type="radio"], .idp-radio-label input[type="checkbox"] {
            margin-right: 12px;
            accent-color: #0f5132;
            width: 16px;
            height: 16px;
        }
    </style>
    <!-- React & Tailwind CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnsrsVB7gzj_nugHJX_t2KJgfefljLNSeruBZhpxDQ-rk000eoN5qOpNaAagTl3Z3nHg/exec";

        const LISTENING_CORRECT_ANSWERS = {
            'l_q1': ['80', '£80', '80 pounds'],
            'l_q2': ['garage'],
            'l_q3': ['supermarket'],
            'l_q4': ['petrol'],
            'l_q5': ['heater'],
            'l_q6': ['toaster'],
            'l_q7': ['kitchen'],
            'l_q8': ['1 june', '1st june', 'june 1', 'june 1st'],
            'l_q9': ['friday evening'],
            'l_q10': ['exam'],
            'l_q11': ['money'],
            'l_q12': ['school'],
            'l_q13': 'E',
            'l_q14': 'C',
            'l_q15': 'F',
            'l_q16': 'A',
            'l_q17': 'A',
            'l_q18': 'A',
            'l_q19': 'B',
            'l_q20': 'A',
            'l_q21': ['student loans'],
            'l_q22': ['finance officer'],
            'l_q23': ['smoking'],
            'l_q24': ['supermarket'],
            'l_q25': ['natural medicine'],
            'l_q26': ['careers office'],
            'l_q27': ['email attachment'],
            'l_q28': ['5 november', '5th november', 'november 5', 'november 5th'],
            'l_q29': ['data analysis'],
            'l_q30': ['presentation'],
            'l_q31': ['law'],
            'l_q32': ['cigar'],
            'l_q33': ['footprint'],
            'l_q34': ['light'],
            'l_q35': ['grass'],
            'l_q36': ['nature'],
            'l_q37': ['air-conditioning', 'air conditioning'],
            'l_q38': ['lungs'],
            'l_q39': ['clubroom'],
            'l_q40': ['city']
        };

        const calculateIELTSBand = (correct) => {
            if (correct >= 39) return "9.0";
            if (correct >= 37) return "8.5";
            if (correct >= 35) return "8.0";
            if (correct >= 32) return "7.5";
            if (correct >= 30) return "7.0";
            if (correct >= 26) return "6.5";
            if (correct >= 23) return "6.0";
            if (correct >= 18) return "5.5";
            if (correct >= 16) return "5.0";
            if (correct >= 13) return "4.5";
            if (correct >= 10) return "4.0";
            if (correct >= 8)  return "3.5";
            if (correct >= 6)  return "3.0";
            if (correct >= 4)  return "2.5";
            return "2.0";
        };

        const checkAnswer = (qId, value) => {
            const correct = LISTENING_CORRECT_ANSWERS[qId];
            if (!correct) return false;

            if (Array.isArray(correct)) {
                if (Array.isArray(value)) {
                    const sortedCorrect = [...correct].sort();
                    const sortedValue = [...value].sort();
                    return sortedCorrect.length === sortedValue.length && sortedCorrect.every((val, index) => val === sortedValue[index]);
                }
                const cleanUser = String(value || '').trim().toLowerCase();
                return correct.some(ans => ans.toLowerCase() === cleanUser);
            }

            return String(value || '').trim().toLowerCase() === String(correct).trim().toLowerCase();
        };

        const SetupScreen = ({ onStartTest }) => {
            const [code, setCode] = useState('');
            const [name, setName] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = () => {
                if (!code.trim() || !name.trim()) {
                    setError('Vui lòng nhập đầy đủ Mã thí sinh/Lớp và Họ tên.');
                    return;
                }
                onStartTest(code, name);
            };

            return (
                <div className="fixed inset-0 bg-gray-100 flex items-center justify-center p-4 z-50">
                    <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-[#0f5132]">
                        <h2 className="text-xl font-bold text-center text-[#0f5132] mb-1">APLUS LANGUAGE CENTER</h2>
                        <h1 className="text-2xl font-black text-center text-gray-800 mb-4">IELTS LISTENING TEST 74</h1>
                        <p className="text-xs text-red-600 mb-6 text-center font-medium">
                            ⚠️ Khóa chuột phải & Chống Copy. Tự động khôi phục Fullscreen khi đóng cảnh báo.
                        </p>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700">Mã số Thí sinh / Lớp</label>
                                <input 
                                    type="text" 
                                    value={code}
                                    onChange={(e) => setCode(e.target.value)}
                                    className="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-[#0f5132] focus:border-[#0f5132]" 
                                    placeholder="Ví dụ: 12A1 / APLUS102"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700">Họ và Tên Thí sinh</label>
                                <input 
                                    type="text" 
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-[#0f5132] focus:border-[#0f5132]" 
                                    placeholder="Ví dụ: Phan Ngọc Huy"
                                />
                            </div>
                        </div>
                        
                        {error && <p className="text-red-500 text-xs mt-3 text-center">{error}</p>}
                        
                        <button 
                            onClick={handleSubmit}
                            className="mt-6 w-full bg-[#0f5132] text-white py-3 rounded-md font-bold hover:bg-[#0b3d26] transition-colors shadow-md"
                        >
                            START TEST (FULLSCREEN)
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [appState, setAppState] = useState('setup');
            const [candidate, setCandidate] = useState({ code: '', name: '' });
            const [answers, setAnswers] = useState({});
            const [currentPart, setCurrentPart] = useState(1);
            const [timeLeft, setTimeLeft] = useState(35 * 60);
            const [warningCount, setWarningCount] = useState(0);
            const [showWarningModal, setShowWarningModal] = useState(false);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState('');
            const [isNotesOpen, setIsNotesOpen] = useState(false);
            const [notesText, setNotesText] = useState('');

            const [popover, setPopover] = useState({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });

            const audioRef = useRef(null);
            const questionsPaneRef = useRef(null);

            const reEnterFullscreen = () => {
                const elem = document.documentElement;
                if (!document.fullscreenElement && elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                }
            };

            const handleCloseWarningModal = () => {
                setShowWarningModal(false);
                reEnterFullscreen();
            };

            useEffect(() => {
                const handleContextMenu = (e) => {
                    e.preventDefault();
                    return false;
                };

                const handleCopy = (e) => {
                    e.preventDefault();
                    return false;
                };

                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('copy', handleCopy);

                return () => {
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('copy', handleCopy);
                };
            }, []);

            const handleMouseUp = (e) => {
                const target = e.target;

                if (target.classList.contains('ielts-highlight')) {
                    const rect = target.getBoundingClientRect();
                    setPopover({
                        visible: true,
                        x: rect.left + window.scrollX + (rect.width / 2) - 40,
                        y: rect.top + window.scrollY - 55,
                        mode: 'delete',
                        node: target,
                        text: ''
                    });
                    return;
                }

                const selection = window.getSelection();
                if (selection && selection.toString().trim().length > 0) {
                    const range = selection.getRangeAt(0);
                    const rect = range.getBoundingClientRect();

                    setPopover({
                        visible: true,
                        x: rect.left + window.scrollX + (rect.width / 2) - 60,
                        y: rect.top + window.scrollY - 55,
                        mode: 'create',
                        node: null,
                        text: selection.toString().trim()
                    });
                } else if (!e.target.closest('.idp-popover')) {
                    setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
                }
            };

            const applyHighlight = () => {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;

                const range = selection.getRangeAt(0);
                const span = document.createElement('span');
                span.className = 'ielts-highlight';
                span.appendChild(range.extractContents());
                range.insertNode(span);

                selection.removeAllRanges();
                setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
            };

            const removeHighlight = () => {
                if (popover.node) {
                    const parent = popover.node.parentNode;
                    while (popover.node.firstChild) {
                        parent.insertBefore(popover.node.firstChild, popover.node);
                    }
                    parent.removeChild(popover.node);
                }
                setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
            };

            const handleCreateNote = () => {
                setIsNotesOpen(true);
                if (popover.text) {
                    setNotesText(prev => prev ? `${prev}\n- ${popover.text}` : `- ${popover.text}`);
                }
                setPopover({ visible: false, x: 0, y: 0, mode: 'create', node: null, text: '' });
            };

            useEffect(() => {
                if (appState !== 'testing' || isSubmitted) return;

                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        setWarningCount(prev => prev + 1);
                        setShowWarningModal(true);
                    }
                };

                const handleFullscreenChange = () => {
                    if (!document.fullscreenElement && !isSubmitted) {
                        setWarningCount(prev => prev + 1);
                        setShowWarningModal(true);
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                document.addEventListener('fullscreenchange', handleFullscreenChange);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                };
            }, [appState, isSubmitted]);

            useEffect(() => {
                if (appState !== 'testing' || isSubmitted) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleSubmitTest();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [appState, isSubmitted]);

            const handleStartTest = (code, name) => {
                setCandidate({ code, name });
                setAppState('testing');
                reEnterFullscreen();

                setTimeout(() => {
                    if (audioRef.current) {
                        audioRef.current.play().catch(e => console.log("Autoplay audio error:", e));
                    }
                }, 500);
            };

            const handleAnswerChange = (qId, val) => {
                setAnswers(prev => ({ ...prev, [qId]: val }));
            };

            const countPartAnswered = (start, end) => {
                let cnt = 0;
                for (let i = start; i <= end; i++) {
                    const qKey = `l_q${i}`;
                    const val = answers[qKey];
                    if (Array.isArray(val) && val.length > 0) cnt++;
                    else if (val && String(val).trim() !== '') cnt++;
                }
                return cnt;
            };

            const handleSubmitTest = async () => {
                setIsSubmitted(true);
                setIsSubmitting(true);

                let correctCount = 0;
                Object.keys(LISTENING_CORRECT_ANSWERS).forEach(qId => {
                    if (checkAnswer(qId, answers[qId])) {
                        correctCount += 1;
                    }
                });

                const bandScore = calculateIELTSBand(correctCount);

                const payload = {
                    sheetName: "IELTS TESTS",
                    testType: "IELTS TESTS - LISTENING TEST 74",
                    candidateCode: candidate.code,
                    candidateName: candidate.name,
                    correctCount: `${correctCount}/40`,
                    score: bandScore,
                    warningCount: warningCount
                };

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    setSubmitStatus('✅ Đã gửi kết quả thành công lên Google Sheets!');
                } catch (err) {
                    setSubmitStatus('❌ Lỗi gửi dữ liệu. Vui lòng chụp lại màn hình kết quả!');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const formatMinutesLeft = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s < 10 ? '0' : ''}${s} minutes left`;
            };

            if (appState === 'setup') {
                return <SetupScreen onStartTest={handleStartTest} />;
            }

            return (
                <div className="h-screen flex flex-col" onMouseUp={handleMouseUp}>
                    {popover.visible && (
                        <div 
                            className="idp-popover" 
                            style={{ top: `${popover.y}px`, left: `${popover.x}px` }}
                        >
                            {popover.mode === 'create' ? (
                                <>
                                    <button onClick={handleCreateNote} className="idp-popover-btn border-r">
                                        <svg className="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                                        Note
                                    </button>
                                    <button onClick={applyHighlight} className="idp-popover-btn">
                                        <svg className="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                        Highlight
                                    </button>
                                </>
                            ) : (
                                <button onClick={removeHighlight} className="idp-popover-btn text-red-600">
                                    <svg className="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    Delete Highlight
                                </button>
                            )}
                        </div>
                    )}

                    {showWarningModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[999] backdrop-blur-sm">
                            <div className="bg-white rounded-xl p-6 max-w-md w-full shadow-2xl border-t-8 border-red-600 text-center animate-bounce-once">
                                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                </div>
                                <h3 className="text-xl font-bold text-gray-900 mb-2">CẢNH BÁO VI PHẠM KỲ THI</h3>
                                <p className="text-sm text-gray-600 mb-4">
                                    Hệ thống phát hiện bạn vừa <strong>chuyển tab</strong> hoặc <strong>thoát Toàn màn hình (Fullscreen)</strong>.
                                </p>
                                <div className="bg-red-50 text-red-700 p-3 rounded-lg font-bold text-xs mb-6 border border-red-200">
                                    Số lần vi phạm ghi nhận: {warningCount}
                                </div>
                                <button 
                                    onClick={handleCloseWarningModal}
                                    className="w-full bg-[#0f5132] hover:bg-[#0b3d26] text-white py-3 rounded-lg font-bold transition-all shadow-md flex items-center justify-center space-x-2"
                                >
                                    <span>Quay lại bài thi (Mở Fullscreen)</span>
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-2V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="header-top">
                        <div className="flex items-center space-x-6">
                            <div className="aplus-brand">APLUS</div>
                            <div className="text-xs text-gray-700 font-medium">
                                Test taker ID: <span className="font-bold text-gray-900">{candidate.code} ({candidate.name})</span>
                            </div>
                            <div className="text-xs text-gray-600 flex items-center space-x-1">
                                <span className="w-2 h-2 rounded-full bg-green-500 inline-block animate-pulse"></span>
                                <span>Audio is Playing</span>
                            </div>
                        </div>

                        <div className="font-bold text-sm text-[#f97316]">
                            {formatMinutesLeft(timeLeft)}
                        </div>

                        <div className="flex items-center space-x-5 text-gray-600">
                            {warningCount > 0 && (
                                <span className="text-xs bg-red-100 text-red-700 px-2.5 py-1 rounded-full font-bold border border-red-300">
                                    Cảnh báo: {warningCount}
                                </span>
                            )}
                            <svg className="w-5 h-5 cursor-pointer hover:text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.858 15.355-5.858 21.213 0"></path></svg>

                                                    <span className="block text-xs text-gray-500">HỌ TÊN</span>
                                                    <span className="font-bold text-base text-gray-800">{candidate.name}</span>
                                                </div>
                                                <div>
                                                    <span className="block text-xs text-gray-500">SỐ CÂU ĐÚNG</span>
                                                    <span className="font-bold text-xl text-green-600">{correct} / 40</span>
                                                </div>
                                                <div>
                                                    <span className="block text-xs text-gray-500">BAND SCORE</span>
                                                    <span className="font-black text-2xl text-[#0f5132]">{band}</span>
                                                </div>
                                            </div>

                                            <h3 className="font-bold text-base text-gray-800 mb-3">Bảng Đáp Án Chi Tiết:</h3>
                                            <div className="grid grid-cols-2 md:grid-cols-3 gap-2 text-xs">
                                                {Object.keys(LISTENING_CORRECT_ANSWERS).map((qId) => {
                                                    const isCorr = checkAnswer(qId, answers[qId]);
                                                    const userVal = Array.isArray(answers[qId]) ? answers[qId].join(', ') : (answers[qId] || '-');
                                                    const keyVal = Array.isArray(LISTENING_CORRECT_ANSWERS[qId]) ? LISTENING_CORRECT_ANSWERS[qId].join(' / ') : LISTENING_CORRECT_ANSWERS[qId];
                                                    return (
                                                        <div key={qId} className={`p-2 border rounded ${isCorr ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-300'}`}>
                                                            <span className="font-bold">{qId.replace('l_q', 'Câu ')}:</span> {userVal}
                                                            <br/>
                                                            <span className="text-gray-500">Đ.Án: {keyVal}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })()}

                                <button 
                                    onClick={() => window.location.reload()}
                                    className="mt-6 w-full bg-gray-800 text-white py-2.5 rounded font-bold hover:bg-black"
                                >
                                    Đóng & Làm Bài Mới
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
