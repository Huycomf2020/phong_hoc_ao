<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APLUS - IELTS READING MOCK TEST 6</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            /* Chống bôi đen văn bản */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* IELTS IDP Dark Green Header */
        .aplus-brand {
            color: #0f5132;
            font-weight: 900;
            font-size: 1.35rem;
            letter-spacing: -0.5px;
        }

        .header-top {
            height: 52px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 20;
        }

        .part-header-banner {
            background-color: #f0f2f5;
            border-bottom: 1px solid #e0e0e0;
            padding: 0.6rem 1.5rem;
            font-size: 0.95rem;
            color: #333;
        }

        /* Split Screen Area */
        .main-workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .passage-pane {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
        }

        .divider-handle {
            width: 14px;
            background: #e8ecef;
            border-left: 1px solid #d1d5db;
            border-right: 1px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: col-resize;
            color: #666;
            font-size: 10px;
        }

        .questions-pane {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: #ffffff;
        }

        /* Footer Test Navigation */
        .test-footer {
            height: 60px;
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            z-index: 20;
        }

        .nav-part-btn {
            padding: 4px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4b5563;
            border-radius: 4px;
            cursor: pointer;
        }

        .nav-part-btn.active {
            color: #0f5132;
            background-color: #e8f5e9;
        }

        .q-square {
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid #d1d5db;
            border-radius: 3px;
            background: #fff;
            color: #374151;
            cursor: pointer;
            margin: 0 1px;
        }

        .q-square.answered {
            background-color: #e5e7eb;
            font-weight: 700;
            border-color: #9ca3af;
        }

        /* Custom Scrollbars */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        /* Radio option styling like IDP */
        .idp-radio-label {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .idp-radio-label:hover {
            background-color: #f3f4f6;
        }
        .idp-radio-label input[type="radio"] {
            margin-right: 12px;
            accent-color: #0f5132;
            width: 16px;
            height: 16px;
        }
    </style>
    <!-- React CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnsrsVB7gzj_nugHJX_t2KJgfefljLNSeruBZhpxDQ-rk000eoN5qOpNaAagTl3Z3nHg/exec";

        // Đáp án chuẩn 40 câu từ file [VOL 9] Reading Test 1.pdf
        const READING_CORRECT_ANSWERS = {
            'r_q1': 'FALSE',
            'r_q2': 'NOT GIVEN',
            'r_q3': 'FALSE',
            'r_q4': 'TRUE',
            'r_q5': 'TRUE',
            'r_q6': 'FALSE',
            'r_q7': 'water',
            'r_q8': 'cyclones',
            'r_q9': 'farming',
            'r_q10': 'logging',
            'r_q11': 'animals',
            'r_q12': 'maps',
            'r_q13': 'book',
            'r_q14': 'vii',
            'r_q15': 'xi',
            'r_q16': 'v',
            'r_q17': 'iv',
            'r_q18': 'ii',
            'r_q19': 'ix',
            'r_q20': 'vi',
            'r_q21': 'A',
            'r_q22': 'C',
            'r_q23': 'civilisation',
            'r_q24': 'barter',
            'r_q25': 'silver',
            'r_q26': 'inflation',
            'r_q27': 'B',
            'r_q28': 'H',
            'r_q29': 'E',
            'r_q30': 'F',
            'r_q31': 'C',
            'r_q32': 'H',
            'r_q33': 'D',
            'r_q34': 'naringin',
            'r_q35': 'poisonous',
            'r_q36': 'genetic',
            'r_q37': 'supertasters',
            'r_q38': 'taste buds',
            'r_q39': 'A',
            'r_q40': 'C'
        };

        const calculateIELTSBand = (correct) => {
            if (correct >= 39) return "9.0";
            if (correct >= 37) return "8.5";
            if (correct >= 35) return "8.0";
            if (correct >= 33) return "7.5";
            if (correct >= 30) return "7.0";
            if (correct >= 27) return "6.5";
            if (correct >= 23) return "6.0";
            if (correct >= 19) return "5.5";
            if (correct >= 15) return "5.0";
            if (correct >= 13) return "4.5";
            if (correct >= 10) return "4.0";
            if (correct >= 8)  return "3.5";
            if (correct >= 6)  return "3.0";
            if (correct >= 4)  return "2.5";
            return "2.0";
        };

        const checkAnswer = (qId, value) => {
            const correct = READING_CORRECT_ANSWERS[qId];
            if (!correct) return false;
            const cleanVal = String(value || '').trim().toLowerCase();
            const cleanCorr = String(correct).trim().toLowerCase();
            
            // Xử lý linh hoạt đối với câu hỏi chọn 2 đáp án (Questions 21-22)
            if (qId === 'r_q21' || qId === 'r_q22') {
                return cleanVal === 'a' || cleanVal === 'c';
            }
            if (qId === 'r_q23' && (cleanVal === 'civilization' || cleanVal === 'civilisation')) return true;
            return cleanVal === cleanCorr;
        };

        // Form Đăng nhập Thí sinh
        const SetupScreen = ({ onStartTest }) => {
            const [code, setCode] = useState('');
            const [name, setName] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = () => {
                if (!code.trim() || !name.trim()) {
                    setError('Vui lòng nhập đầy đủ Mã thí sinh/Lớp và Họ tên.');
                    return;
                }
                onStartTest(code, name);
            };

            return (
                <div className="fixed inset-0 bg-gray-100 flex items-center justify-center p-4 z-50">
                    <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-[#0f5132]">
                        <h2 className="text-xl font-bold text-center text-[#0f5132] mb-1">APLUS LANGUAGE CENTER</h2>
                        <h1 className="text-2xl font-black text-center text-gray-800 mb-4">IELTS READING MOCK TEST 6</h1>
                        <p className="text-xs text-red-600 mb-6 text-center font-medium">
                            ⚠️ Hệ thống sẽ tự động bật Toàn màn hình, khóa chuột phải và chống copy. Vi phạm chuyển tab sẽ bị ghi nhận!
                        </p>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700">Mã số Thí sinh / Lớp</label>
                                <input 
                                    type="text" 
                                    value={code}
                                    onChange={(e) => setCode(e.target.value)}
                                    className="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-[#0f5132] focus:border-[#0f5132]" 
                                    placeholder="Ví dụ: 12A1 / APLUS106"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700">Họ và Tên Thí sinh</label>
                                <input 
                                    type="text" 
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-[#0f5132] focus:border-[#0f5132]" 
                                    placeholder="Ví dụ: Phan Ngọc Huy"
                                />
                            </div>
                        </div>
                        
                        {error && <p className="text-red-500 text-xs mt-3 text-center">{error}</p>}
                        
                        <button 
                            onClick={handleSubmit}
                            className="mt-6 w-full bg-[#0f5132] text-white py-3 rounded-md font-bold hover:bg-[#0b3d26] transition-colors shadow-md"
                        >
                            BẮT ĐẦU BÀI THI (FULLSCREEN)
                        </button>
                    </div>
                </div>
            );
        };

        // App Chính
        const App = () => {
            const [appState, setAppState] = useState('setup');
            const [candidate, setCandidate] = useState({ code: '', name: '' });
            const [answers, setAnswers] = useState({});
            const [currentPart, setCurrentPart] = useState(1);
            const [timeLeft, setTimeLeft] = useState(60 * 60);
            const [warningCount, setWarningCount] = useState(0);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState('');

            // Chống chuột phải & Bôi đen văn bản
            useEffect(() => {
                const handleContextMenu = (e) => e.preventDefault();
                const handleSelectStart = (e) => e.preventDefault();
                const handleCopy = (e) => e.preventDefault();

                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('selectstart', handleSelectStart);
                document.addEventListener('copy', handleCopy);

                return () => {
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('selectstart', handleSelectStart);
                    document.removeEventListener('copy', handleCopy);
                };
            }, []);

            // Cảnh báo khi vi phạm thoát màn hình / chuyển tab
            useEffect(() => {
                if (appState !== 'testing' || isSubmitted) return;

                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        setWarningCount(prev => {
                            const newCount = prev + 1;
                            alert(`⚠️ CẢNH BÁO VI PHẠM (${newCount}): Bạn vừa chuyển tab hoặc rời khỏi bài thi!`);
                            return newCount;
                        });
                    }
                };

                const handleFullscreenChange = () => {
                    if (!document.fullscreenElement) {
                        setWarningCount(prev => {
                            const newCount = prev + 1;
                            alert(`⚠️ CẢNH BÁO VI PHẠM (${newCount}): Bạn đã thoát khỏi chế độ Toàn màn hình!`);
                            return newCount;
                        });
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                document.addEventListener('fullscreenchange', handleFullscreenChange);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                };
            }, [appState, isSubmitted]);

            // Timer đếm ngược 60 phút
            useEffect(() => {
                if (appState !== 'testing' || isSubmitted) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleSubmitTest();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [appState, isSubmitted]);

            const handleStartTest = (code, name) => {
                setCandidate({ code, name });
                setAppState('testing');
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                }
            };

            const handleAnswerChange = (qId, val) => {
                setAnswers(prev => ({ ...prev, [qId]: val }));
            };

            const countPartAnswered = (start, end) => {
                let cnt = 0;
                for (let i = start; i <= end; i++) {
                    if (answers[`r_q${i}`] && String(answers[`r_q${i}`]).trim() !== '') {
                        cnt++;
                    }
                }
                return cnt;
            };

            const handleSubmitTest = async () => {
                const totalAnswered = Object.keys(answers).filter(k => String(answers[k]).trim() !== '').length;
                if (totalAnswered < 40 && !confirm(`Bạn mới làm ${totalAnswered}/40 câu. Bạn có chắc chắn muốn nộp bài?`)) {
                    return;
                }

                setIsSubmitted(true);
                setIsSubmitting(true);

                let correctCount = 0;
                Object.keys(READING_CORRECT_ANSWERS).forEach(qId => {
                    if (checkAnswer(qId, answers[qId])) correctCount++;
                });

                const bandScore = calculateIELTSBand(correctCount);

                const payload = {
                    sheetName: "IELTS TESTS",
                    testType: "IELTS TESTS - MOCK TEST 6",
                    candidateCode: candidate.code,
                    candidateName: candidate.name,
                    correctCount: `${correctCount}/40`,
                    score: bandScore,
                    warningCount: warningCount
                };

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    setSubmitStatus('✅ Đã gửi kết quả thành công lên Google Sheets!');
                } catch (err) {
                    setSubmitStatus('❌ Lỗi gửi dữ liệu. Vui lòng chụp màn hình báo cho giáo viên!');
                } finally {
                    setIsSubmitting(false);
                }
            };

            if (appState === 'setup') {
                return <SetupScreen onStartTest={handleStartTest} />;
            }

            return (
                <div className="h-screen flex flex-col">
                    {/* Header IDP Style */}
                    <header className="header-top">
                        <div className="flex items-center space-x-6">
                            <div className="aplus-brand">APLUS</div>
                            <div className="text-xs text-gray-600">
                                Test taker ID: <span className="font-semibold text-gray-800">{candidate.code} ({candidate.name})</span>
                            </div>
                        </div>

                        <div className="font-semibold text-sm text-gray-700">
                            {Math.floor(timeLeft / 60)} minutes left
                        </div>

                        <div className="flex items-center space-x-3">
                            {warningCount > 0 && (
                                <span className="text-xs bg-red-100 text-red-700 px-2 py-1 rounded font-bold border border-red-300">
                                    Cảnh báo: {warningCount}
                                </span>
                            )}
                            <button 
                                onClick={handleSubmitTest}
                                className="bg-[#0f5132] hover:bg-[#0b3d26] text-white text-xs font-bold px-4 py-2 rounded shadow-sm transition-colors"
                            >
                                Submit
                            </button>
                        </div>
                    </header>

                    {/* Part Banner Header */}
                    <div className="part-header-banner font-medium">
                        Reading Part {currentPart}
                        <span className="text-xs text-gray-500 ml-2">Read the passage and answer questions {currentPart === 1 ? '1–13' : currentPart === 2 ? '14–26' : '27–40'}.</span>
                    </div>

                    {/* Split Workspace */}
                    <div className="main-workspace">
                        {/* Cột trái: Passage */}
                        <div className="passage-pane custom-scrollbar">
                            {currentPart === 1 && (
                                <div>
                                    <h1 className="text-xl font-bold text-gray-900 mb-2 text-center">The Baobabs of Madagascar</h1>
                                    <p className="italic text-sm text-gray-600 mb-4 text-center">The ancient baobabs of Madagascar are some of the largest and most distinctive trees in the world, but they face an uncertain future</p>
                                    <div className="space-y-4 text-sm text-gray-800 leading-relaxed">
                                        <p>The island of Madagascar in the Indian Ocean is the best place in the world to see baobabs. These spectacular trees, with their massive trunks and distinctive horizontal root-like branches, can live over 800 years. Of the eight known species, six are found only there, while a seventh has made its way across the Mozambique Channel from mainland Africa with a certain amount of human help.</p>
                                        <p>Some of the most visited and photographed baobabs in Madagascar are at the Avenue des Baobabs in the western province of Menabe, close to the town of Morondava. There, a dozen trees straddle a narrow sandy road, soaring 30 metres into the sky. Known as renala - 'mother of the forest' - in the local Malagasy language, these trees belong to the tallest baobab species in the world: <i>Adansonia grandidieri</i>, named after two great 19th-century French botanists, Michel Adanson and Alfred Grandidier.</p>
                                        <p>Baobabs have religious and spiritual significance for many Malagasy tribes, although the majority of the island's population will probably never see one: they only grow along the western margin of the island and not in the more populous central highlands. However, as the national tree and the national emblem, the trees are an ideal symbol for increasing awareness not only of the endangered forests, but also of the traditional beliefs of the people who live alongside them. But what does the future hold for the Malagasy baobabs?</p>
                                        <p>The Avenue des Baobabs is something of a contradiction; the 'natural' scene that tourists visit is actually man-made. While the trees themselves are natural enough, the surrounding landscape was created by humans. Back in the early 20th century, much of the Morondava plain was cleared for rice and sugar-cane fields. However, many baobabs were spared because they are valuable as a food source and renewable building material, or they simply survived the fires that were set to clear the dry deciduous forest around them. These days many stand alone in fields, a reminder of where the forest once was. But now it seems that even the mighty baobabs are falling down. 'Every year I see new trees that have fallen,' says Jim Bond, an ethnobotanist who has studied Madagascar's baobabs for more than a decade. The exact cause of the falling baobabs is uncertain, but some people think that the water used to irrigate the nearby fields is partly to blame. Baobabs are adapted to the annual wet season, but their roots can't cope with constantly waterlogged soils. Lone trees separated from the surrounding forest are also susceptible to cyclones, which reach speeds of over 200 kph in the area, and can easily uproot even a 30-metre baobab.</p>
                                        <p>Baobabs elsewhere on the island are also facing a host of threats, with three of the six native species now listed as endangered by the World Conservation Union. David Baum from the University of Wisconsin has spent years researching Malagasy baobabs. 'The main threat to their survival is land clearance for farming, which probably suppresses regeneration,' he says. Burning is the usual method of clearing land, and while baobabs have some resistance to this, they will eventually succumb to repeated burning. Human disturbance in the forest, such as logging, is also a problem. This practice may be promoting the rapid spread of shrubby undergrowth, which quickly fills in the bright forest gaps needed for baobab germination. Another problem the trees face is the dispersal of their seeds. Baum suggests that dispersal is being limited by the absence of two large, now extinct animals - a gorilla-sized lemur and the three-metre-tall elephant bird. Passage through the digestive tract of these giant fruit-eating animals probably once played a vital role in the distribution of the renala baobabs in particular.</p>
                                        <p>The Malagasy government is becoming increasingly concerned as the baobab is key to the local tourism industry, and thus to the economy of the island as a whole. But visiting and photographing the solitary trees in the dramatic open landscape at the Avenue des Baobabs isn't the only way to experience baobabs in Madagascar. Within a few hours' drive of Morondava, three species of baobab can be seen in largely intact, dry forest habitat. Jim Bond has led expeditions of Malagasy and foreign participants to the Mikea forest in the island's southwest, which is almost certainly one of the least studied and least damaged areas of baobab forest left in Madagascar. On his expeditions Bond works closely with local people to search for, and create maps of baobab distribution. He also plans to compile an illustrated children's book of the many local folk-tales about the tree, hoping that national and international versions will help to spread the word about how important baobabs are in Malagasy culture. But it's going to require some swift and coordinated action to ensure that the baobab becomes a symbol of conservation success, rather than a symbol of humanity's mistakes.</p>
                                    </div>
                                </div>
                            )}

                            {currentPart === 2 && (
                                <div>
                                    <h1 className="text-xl font-bold text-gray-900 mb-2 text-center">Coins - the first form of money</h1>
                                    <div className="space-y-4 text-sm text-gray-800 leading-relaxed">
                                        <p><strong>Paragraph 14:</strong> Few people pay much attention to coins; we take them for granted. Since the advent of paper currency and the abandonment of a monetary system based on intrinsic or actual value, they have been demoted to the status of change: what is left when you have paid for something with 'paper' money. There is even a belief that they will one day be obsolete, as will paper or plastic notes, and money will at last have achieved the pure status of a mathematical formulation, a system of electronic credits and debits.</p>
                                        <p><strong>Paragraph 15:</strong> In the modern media environment, the sheer number of visual images is overwhelming, but it makes one stop to think that coins are among the most durable of our artefacts, and future archaeologists will scrutinise coins in order to learn about their distant ancestors. This is exactly the way ancient coins have informed us for over four millennia. There are thousands of different coins, each designed to carry meaning as well as value, tiny but rich sources of documentary evidence about events and cultural attitudes, frequently produced with exquisite craftsmanship.</p>
                                        <p><strong>Paragraph 16:</strong> Coins in Europe date from 2,500 to 2,700 years ago, and seem to have originated in the ancient kingdom of Lydia, in what is now Turkey. Before coins, trade was based on barter: the direct trade of commodities. Barter required the physical presence of both commodities that were being traded. Metal coins were far more portable, and not subject to the same spoilage on long sea journeys as a commodity like grain might be if it became wet. However, they could also be accumulated, and these hoards could be stolen. Coins were therefore a temptation to criminals. The Greeks, however, were the first to realise the full potential of the new invention. They were a trading people of seafarers. Their civilisation, which was composed of dozens of city-states, was highly decentralised. Despite the potential for theft, the Greeks realised that they could benefit enormously from a system that used coins, because it meant that they no longer had to carry goods with them to barter.</p>
                                        <p><strong>Paragraph 17:</strong> The value of coins was generally based on the intrinsic value of the metal they were made of. At first this was mostly silver, and this meant that the discovery of silver mines on Greek territory actually increased the quantity of money they could produce. Had the Greek mining been on a larger scale, it could have caused problems similar to those faced by the Spanish centuries later, when so much gold from the New World was brought into their economy that it resulted in serious inflation. One advantage of intrinsic value was that coins could be weighed to determine the amount of metal they contained, so that the only thing an issuing state had to guarantee was the purity of the metal to prevent accusations of fraud and cheating, which could cause fighting and unrest. This was quite difficult to do, especially with coins made of gold, until Archimedes realised that different metals have different weight-volume ratios, and that by measuring the amount of displacement when coins were immersed in water, it was possible to establish whether gold was alloyed with silver.</p>
                                        <p><strong>Paragraph 18:</strong> All ancient coins were made by hand using engraved metal moulds. Many hundreds of coins were made, and as a result the moulds often cracked and new ones had to be engraved. This explains the endless variety encountered in coins with the same designs because the moulds had to be remade repeatedly, by many different artisans. One of the distinctive features of coins, in fact, is that they are the work of anonymous craftsmen, and yet each coin is an intimate reflection of the character of its city of origin. It was the Greeks who realised that coins could have a double function, as a unit of value and as a symbol of the identity of the city that issued them. The Greek view of life was deeply motivated by a spirit of competition, and coins, which circulated around the trading world, were a way of advertising the qualities of each particular city-state.</p>
                                        <p><strong>Paragraph 19:</strong> Interestingly, Greek coins from the city of Athens, which was the home of the greatest sculptors of the classical period, seem to have been completely disconnected from the high sculptural tradition. The beautiful features of the city's patron, Athena (with her owl on the reverse of the coin), seem to have been repeated virtually unaltered for many years. Perhaps this was because the Athenian currency had grown increasingly to be the international standard and, like the US dollar today, a uniform design implied integrity.</p>
                                        <p><strong>Paragraph 20:</strong> One side of a coin was always occupied by the head of a divinity, so it was a relatively small step, at around 323 BC, for Greek coins to replace that head with the portrait of the reigning monarch, a tradition that has continued in monarchies to the present day. Republics may have either symbolic heads - going back to the older tradition of divinities or the features of a distinguished past head of state. The Romans adopted the Greek practice of coin design and as a result, the features of many great Romans have survived and are known to modern generations, despite the fact that the art of portrait painting was completely lost for more than a millennium following the fall of the Roman Empire.</p>
                                    </div>
                                </div>
                            )}

                            {currentPart === 3 && (
                                <div>
                                    <h1 className="text-xl font-bold text-gray-900 mb-2 text-center">Creating a Better Grapefruit</h1>
                                    <p className="italic text-sm text-gray-600 mb-4 text-center">By blocking the right taste receptors, biotech researchers turn bitter into sweet</p>
                                    <div className="space-y-4 text-sm text-gray-800 leading-relaxed">
                                        <p><strong>Paragraph A:</strong> There is a reason why grapefruit juice is served in little glasses. Most people don't want to drink more than a few ounces at a time. This is because a natural chemical compound found in grapefruit, naringin, has a bitter taste. Some people like that bitterness in small doses and believe it enhances the general flavour, but others would rather avoid it altogether. So juice packagers often select grapefruit with low naringin content, even though the compound has antioxidant properties that some nutritionists contend may help prevent many serious diseases.</p>
                                        <p><strong>Paragraph B:</strong> It is possible, however, to get the goodness of grapefruit without the bitter taste. In a test conducted by a biotechnology company, sets of two miniature white paper cups, labelled 304 and 305, were placed before five people seated around a conference table. Each person drank from one cup and then the other, cleansing their palates between tastes with water and a cracker. Even the smallest sip of 304 had grapefruit's unmistakeable bite. But 305 was smoother; there was the sour taste of citrus but none of the bitterness of naringin. This juice had been treated with AMP, a compound that blocks the bitterness in foods without making them less nutritious.</p>
                                        <p><strong>Paragraph C:</strong> Taste research is a booming business these days, with scientists delving into all five basics: sweet, bitter, sour, salty, and umami (the savory taste of protein). However, bitterness is of special interest to the food industry because it is present in so many different types of food. There are thousands of bitter-tasting compounds in nature. They defend plants by warning animals away and protect animals by letting them know when a plant may be poisonous. But the system isn't foolproof. Grapefruit and bitter green vegetables like Brussels sprouts and kale are nutritious despite - and sometimes because of - their bitter-tasting components.</p>
                                        <p><strong>Paragraph D:</strong> 'Humans are the only species that enjoys a bitter taste,' says Charles Zuker, a neuroscientist at the University of California School of Medicine at San Diego. 'Every other species is averse to bitter because it means bad news. But we have learned to enjoy it. We drink coffee, which is bitter, and quinine (in tonic water) too. We enjoy having that spice in our lives.' Because bitterness can be pleasant in small quantities but repellent when intense, bitter blockers like AMP could make a whole range of foods, drinks and medicines more palatable.</p>
                                        <p><strong>Paragraph E:</strong> People have varying capacities for tasting bitterness and the differences appear to be genetic. About 75% of people are sensitive to the taste of some well-identified bitter compounds. Those who are sensitive seem to be less likely than others to eat bitter vegetables, according to Stephen Wooding, a geneticist at the University of Utah. Some people who have an unusually high number of taste buds, and are known as 'supertasters', are especially sensitive to these compounds. Supertasters tend to shun all kinds of bitter-tasting things, including vegetables, coffee, and dark chocolate.</p>
                                        <p><strong>Paragraph F:</strong> The tongue is covered with taste buds. Under the microscope each one looks like an onion, consisting of 50 to 100 elongated cells running from the top of the taste buds to the bottom. At the top is a group of receptors that captures the taste molecules, known as tastants, in food and drink. The receptors function much like those for sight and smell. Once a bitter signal has been received, it is relayed via proteins known as G proteins. The G protein involved in the perception of bitterness, sweetness and umami was identified in the early 1990s by Robert Margolskee, at Mount Sinai School of Medicine in New York. The protein triggers a cascade of chemical reactions that lead to ion concentrations within the cell. Ultimately, this delivers a signal to the brain that registers as bitter.</p>
                                        <p><strong>Paragraph G:</strong> Once they understood the taste mechanism, scientists began to think of ways to interfere with it. They tried AMP, an organic compound found in breast milk and other substances, that is created as cells break down food. AMP has no bitterness of its own, but when put in foods, as Margolskee and his colleagues discovered, it attaches to bitter-taste receptors. As effective as it is, AMP may not be able to dampen every type of bitter taste because it probably doesn't attach to all 30 bitter-taste receptors.</p>
                                        <p><strong>Paragraph H:</strong> Some taste researchers believe that, in time, compounds like AMP will help make processed foods less unhealthy. Consider, for example, that a single cup of canned chicken noodle soup contains 850 milligrams of sodium chloride, or table salt - more than a third of the recommended daily allowance. The salt masks the bitterness created by the high temperatures used in the canning process, which cause sugars and amino acids to react. Part of the table salt could be replaced by another type of salt, potassium chloride, which tends to be scarce in some people's diets because of its bitter taste. But that bitter taste could be eliminated with a dose of AMP. Bitter blockers could also be used in place of sugary cherry and grape flavourings in children's cough syrups, and they could dampen the bitterness of drugs like antihistamines, antibiotics and other similar products.</p>
                                        <p><strong>Paragraph I:</strong> A number of foodmakers have already begun to experiment with AMP in their products, and other bitter blockers are being developed. In a few years, perhaps, after food companies have taken the bitterness from canned soup and improved the taste of medicines, they can set their sights on something more useful: a bitter blocker in a bottle that any of us can sprinkle on our Brussels sprouts or stir into our grapefruit juice.</p>

                                                            <span className="font-bold">Câu {idx + 1}:</span> {answers[qId] || '-'}
                                                            <br/>
                                                            <span className="text-gray-500">Đ.Án: {READING_CORRECT_ANSWERS[qId]}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })()}

                                <button 
                                    onClick={() => window.location.reload()}
                                    className="mt-6 w-full bg-gray-800 text-white py-2.5 rounded font-bold hover:bg-black"
                                >
                                    Đóng & Làm Bài Mới
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
