<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APLUS - IELTS Reading Practice Test 1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            /* Chống bôi đen văn bản */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* IELTS IDP Dark Green Header */
        .aplus-brand {
            color: #0f5132;
            font-weight: 900;
            font-size: 1.35rem;
            letter-spacing: -0.5px;
        }

        .header-top {
            height: 52px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 20;
        }

        .part-header-banner {
            background-color: #f0f2f5;
            border-bottom: 1px solid #e0e0e0;
            padding: 0.6rem 1.5rem;
            font-size: 0.95rem;
            color: #333;
        }

        /* Split Screen Area */
        .main-workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .passage-pane {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
        }

        .divider-handle {
            width: 14px;
            background: #e8ecef;
            border-left: 1px solid #d1d5db;
            border-right: 1px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: col-resize;
            color: #666;
            font-size: 10px;
        }

        .questions-pane {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: #ffffff;
        }

        /* Footer Test Navigation */
        .test-footer {
            height: 60px;
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            z-index: 20;
        }

        .nav-part-btn {
            padding: 4px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4b5563;
            border-radius: 4px;
            cursor: pointer;
        }

        .nav-part-btn.active {
            color: #0f5132;
            background-color: #e8f5e9;
        }

        .q-square {
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid #d1d5db;
            border-radius: 3px;
            background: #fff;
            color: #374151;
            cursor: pointer;
            margin: 0 1px;
        }

        .q-square.answered {
            background-color: #e5e7eb;
            font-weight: 700;
            border-color: #9ca3af;
        }

        /* Custom Scrollbars */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        /* Radio option styling like IDP */
        .idp-radio-label {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .idp-radio-label:hover {
            background-color: #f3f4f6;
        }
        .idp-radio-label input[type="radio"] {
            margin-right: 12px;
            accent-color: #0f5132;
            width: 16px;
            height: 16px;
        }
    </style>
    <!-- React CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnsrsVB7gzj_nugHJX_t2KJgfefljLNSeruBZhpxDQ-rk000eoN5qOpNaAagTl3Z3nHg/exec";

        // Đáp án chuẩn 40 câu từ file TEST 1.pdf
        const READING_CORRECT_ANSWERS = {
            'r_q1': 'TRUE',
            'r_q2': 'TRUE',
            'r_q3': 'FALSE',
            'r_q4': 'NOT GIVEN',
            'r_q5': 'FALSE',
            'r_q6': 'TRUE',
            'r_q7': 'ships',
            'r_q8': 'tax',
            'r_q9': 'sun',
            'r_q10': 'weather',
            'r_q11': 'tractors',
            'r_q12': 'ice',
            'r_q13': 'treaty',
            'r_q14': 'iii',
            'r_q15': 'i',
            'r_q16': 'vi',
            'r_q17': 'ii',
            'r_q18': 'v',
            'r_q19': 'vii',
            'r_q20': 'surplus',
            'r_q21': 'innovation',
            'r_q22': 'prosperity',
            'r_q23': 'A',
            'r_q24': 'E',
            'r_q25': 'C',
            'r_q26': 'E',
            'r_q27': 'C',
            'r_q28': 'A',
            'r_q29': 'C',
            'r_q30': 'C',
            'r_q31': 'A',
            'r_q32': 'C',
            'r_q33': 'A',
            'r_q34': 'F',
            'r_q35': 'E',
            'r_q36': 'D',
            'r_q37': 'NO',
            'r_q38': 'NOT GIVEN',
            'r_q39': 'YES',
            'r_q40': 'YES'
        };

        const calculateIELTSBand = (correct) => {
            if (correct >= 39) return "9.0";
            if (correct >= 37) return "8.5";
            if (correct >= 35) return "8.0";
            if (correct >= 33) return "7.5";
            if (correct >= 30) return "7.0";
            if (correct >= 27) return "6.5";
            if (correct >= 23) return "6.0";
            if (correct >= 19) return "5.5";
            if (correct >= 15) return "5.0";
            if (correct >= 13) return "4.5";
            if (correct >= 10) return "4.0";
            if (correct >= 8)  return "3.5";
            if (correct >= 6)  return "3.0";
            if (correct >= 4)  return "2.5";
            return "2.0";
        };

        const checkAnswer = (qId, value) => {
            const correct = READING_CORRECT_ANSWERS[qId];
            if (!correct) return false;
            return String(value || '').trim().toLowerCase() === String(correct).trim().toLowerCase();
        };

        // Form Đăng nhập
        const SetupScreen = ({ onStartTest }) => {
            const [code, setCode] = useState('');
            const [name, setName] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = () => {
                if (!code.trim() || !name.trim()) {
                    setError('Vui lòng nhập đầy đủ Mã thí sinh/Lớp và Họ tên.');
                    return;
                }
                onStartTest(code, name);
            };

            return (
                <div className="fixed inset-0 bg-gray-100 flex items-center justify-center p-4 z-50">
                    <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-[#0f5132]">
                        <h2 className="text-xl font-bold text-center text-[#0f5132] mb-1">APLUS LANGUAGE CENTER</h2>
                        <h1 className="text-2xl font-black text-center text-gray-800 mb-4">IELTS READING MOCK TEST 3</h1>
                        <p className="text-xs text-red-600 mb-6 text-center font-medium">
                            ⚠️ Hệ thống sẽ tự động bật Toàn màn hình, khóa chuột phải và chống bôi đen. Chuyển tab sẽ bị ghi nhận vi phạm!
                        </p>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700">Mã số Thí sinh / Lớp</label>
                                <input 
                                    type="text" 
                                    value={code}
                                    onChange={(e) => setCode(e.target.value)}
                                    className="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-[#0f5132] focus:border-[#0f5132]" 
                                    placeholder="Ví dụ: APLUS001"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700">Họ và Tên Thí sinh</label>
                                <input 
                                    type="text" 
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="mt-1 block w-full border border-gray-300 rounded-md p-3 focus:ring-[#0f5132] focus:border-[#0f5132]" 
                                    placeholder="Ví dụ: Phan Ngọc Huy"
                                />
                            </div>
                        </div>
                        
                        {error && <p className="text-red-500 text-xs mt-3 text-center">{error}</p>}
                        
                        <button 
                            onClick={handleSubmit}
                            className="mt-6 w-full bg-[#0f5132] text-white py-3 rounded-md font-bold hover:bg-[#0b3d26] transition-colors shadow-md"
                        >
                            BẮT ĐẦU BÀI THI (FULLSCREEN)
                        </button>
                    </div>
                </div>
            );
        };

        // App Chính
        const App = () => {
            const [appState, setAppState] = useState('setup');
            const [candidate, setCandidate] = useState({ code: '', name: '' });
            const [answers, setAnswers] = useState({});
            const [currentPart, setCurrentPart] = useState(1);
            const [timeLeft, setTimeLeft] = useState(60 * 60);
            const [warningCount, setWarningCount] = useState(0);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState('');

            // Chống chuột phải & Bôi đen
            useEffect(() => {
                const handleContextMenu = (e) => e.preventDefault();
                const handleSelectStart = (e) => e.preventDefault();
                const handleCopy = (e) => e.preventDefault();

                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('selectstart', handleSelectStart);
                document.addEventListener('copy', handleCopy);

                return () => {
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('selectstart', handleSelectStart);
                    document.removeEventListener('copy', handleCopy);
                };
            }, []);

            // Cảnh báo vi phạm
            useEffect(() => {
                if (appState !== 'testing' || isSubmitted) return;

                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        setWarningCount(prev => {
                            const newCount = prev + 1;
                            alert(`⚠️ CẢNH BÁO VI PHẠM (${newCount}): Bạn vừa chuyển tab hoặc rời khỏi bài thi!`);
                            return newCount;
                        });
                    }
                };

                const handleFullscreenChange = () => {
                    if (!document.fullscreenElement) {
                        setWarningCount(prev => {
                            const newCount = prev + 1;
                            alert(`⚠️ CẢNH BÁO VI PHẠM (${newCount}): Bạn đã thoát khỏi chế độ Toàn màn hình!`);
                            return newCount;
                        });
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                document.addEventListener('fullscreenchange', handleFullscreenChange);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                };
            }, [appState, isSubmitted]);

            // Timer
            useEffect(() => {
                if (appState !== 'testing' || isSubmitted) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleSubmitTest();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [appState, isSubmitted]);

            const handleStartTest = (code, name) => {
                setCandidate({ code, name });
                setAppState('testing');
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                }
            };

            const handleAnswerChange = (qId, val) => {
                setAnswers(prev => ({ ...prev, [qId]: val }));
            };

            const countPartAnswered = (start, end) => {
                let cnt = 0;
                for (let i = start; i <= end; i++) {
                    if (answers[`r_q${i}`] && String(answers[`r_q${i}`]).trim() !== '') {
                        cnt++;
                    }
                }
                return cnt;
            };

            const handleSubmitTest = async () => {
                const totalAnswered = Object.keys(answers).filter(k => String(answers[k]).trim() !== '').length;
                if (totalAnswered < 40 && !confirm(`Bạn mới làm ${totalAnswered}/40 câu. Bạn có chắc chắn muốn nộp bài?`)) {
                    return;
                }

                setIsSubmitted(true);
                setIsSubmitting(true);

                let correctCount = 0;
                Object.keys(READING_CORRECT_ANSWERS).forEach(qId => {
                    if (checkAnswer(qId, answers[qId])) correctCount++;
                });

                const bandScore = calculateIELTSBand(correctCount);

                const payload = {
                    sheetName: "IELTS TESTS",
                    testType: "IELTS TESTS - TEST 1",
                    candidateCode: candidate.code,
                    candidateName: candidate.name,
                    correctCount: `${correctCount}/40`,
                    score: bandScore,
                    warningCount: warningCount
                };

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    setSubmitStatus('✅ Đã gửi kết quả thành công lên Google Sheets!');
                } catch (err) {
                    setSubmitStatus('❌ Lỗi gửi dữ liệu. Vui lòng chụp màn hình báo cho giáo viên!');
                } finally {
                    setIsSubmitting(false);
                }
            };

            if (appState === 'setup') {
                return <SetupScreen onStartTest={handleStartTest} />;
            }

            return (
                <div className="h-screen flex flex-col">
                    {/* Header IDP Style */}
                    <header className="header-top">
                        <div className="flex items-center space-x-6">
                            <div className="aplus-brand">APLUS</div>
                            <div className="text-xs text-gray-600">
                                Test taker ID: <span className="font-semibold text-gray-800">{candidate.code} ({candidate.name})</span>
                            </div>
                        </div>

                        <div className="font-semibold text-sm text-gray-700">
                            {Math.floor(timeLeft / 60)} minutes left
                        </div>

                        <div className="flex items-center space-x-3">
                            {warningCount > 0 && (
                                <span className="text-xs bg-red-100 text-red-700 px-2 py-1 rounded font-bold border border-red-300">
                                    Cảnh báo: {warningCount}
                                </span>
                            )}
                            <button 
                                onClick={handleSubmitTest}
                                className="bg-[#0f5132] hover:bg-[#0b3d26] text-white text-xs font-bold px-4 py-2 rounded shadow-sm transition-colors"
                            >
                                Submit
                            </button>
                        </div>
                    </header>

                    {/* Part Banner Header */}
                    <div className="part-header-banner font-medium">
                        Reading Part {currentPart}
                        <span className="text-xs text-gray-500 ml-2">Read the passage and answer questions {currentPart === 1 ? '1–13' : currentPart === 2 ? '14–26' : '27–40'}.</span>
                    </div>

                    {/* Split Workspace */}
                    <div className="main-workspace">
                        {/* Cột trái: Passage */}
                        <div className="passage-pane custom-scrollbar">
                            {currentPart === 1 && (
                                <div>
                                    <h1 className="text-xl font-bold text-gray-900 mb-4 text-center">The Development of Exploration and Scientific Research in Antarctica</h1>
                                    <div className="space-y-4 text-sm text-gray-800 leading-relaxed">
                                        <p>The modern scientific age in Antarctica really began with the introduction of aircraft in the 1920s. Aircraft transformed the possibilities of exploring the frozen continent around the South Pole, because before that Antarctic travel had been limited to the use of dog-teams pulling sledges. A plane could survey thousands of square kilometres an hour, equivalent to a whole summer's work using previous techniques. However, the first planes in Antarctica, such as the Lockheed Vega and the Ford Trimotor, were unreliable in freezing conditions. This made polar flying particularly hazardous, since there was little chance of rescue if a plane was forced down in a remote region.</p>
                                        <p>It was in 1928 that Herbert Wilkins hoped to make the first flight in Antarctica, attempting to cross the continent. A further attempt in 1930 was also unsuccessful, but Wilkins' aerial photographs seemed to show that the Antarctic Peninsula was in fact an island, not part of the continent as had previously been thought. This new theory caused some excitement among geographers and cartographers. However, the British Grahamland Expedition of 1934-37 proved conclusively that the Antarctic Peninsula was attached to the rest of the continent.</p>
                                        <p>In 1929, the famous American pilot Richard Byrd flew over the South Pole, and another American, Lincoln Ellsworth, made a successful Antarctic flight in 1935. Although Ellsworth claimed a sector of the continent for the USA, the American government did not follow it up. In 1938, the German explorer, Alfred Ritscher, led an expedition south across the sea. Once Antarctica was reached, the aircraft that had been stored in pieces on the ship's deck was reconstructed. The aeroplane was then launched and used to stake a claim to one section of Antarctica by dropping thousands of tiny flags from the air.</p>
                                        <p>A significant motivation behind many Antarctic expeditions right up to the 1940s was simply the spirit of adventure. Many of these expeditions had a large measure of private funding, and often the subsequent book about the expedition was a means of clearing debts incurred. The vast majority of Antarctic expeditions since 1940 have been funded by governments, usually for political reasons and scientific research.</p>
                                        <p>The setting up of the Research and Development Committee in Britain was a significant development in the history of science in the Antarctic. The Committee's report, published in 1920, focused particularly on the sea that circles the Antarctic continent. The report proposed detailed scientific investigations of the physiology and behaviour of the whales inhabiting the region. As a result, a shore station at Grytviken on the island of South Georgia near Antarctica was occupied by scientists for six years. In addition, three research ships were commissioned. They travelled through the Southern Ocean all year, researching physical and chemical oceanography. The high quality of the specimens and data collected by scientists produced nearly 40 large volumes of reports. This entire project came to be known as the Discovery Investigations. The costs of the Discovery Investigations were completely covered by the proceeds of a tax that was placed on whaling businesses operating in the area.</p>
                                        <p>It was in 1875 that the idea of international scientific collaboration at the poles was first proposed, with the aim of collecting valuable data. The result was the first Polar Year in 1882-83. A second Polar Year was organised 50 years later, involving 44 nations and scientific bodies. Both of these Polar Years had been timed to coincide with a period when the sun was at its lowest level of activity, in order to monitor the impact this had. So much interest was aroused by this process that a third Polar Year was organised 25 years later. In 1951 it was decided that this scientific programme should be expanded to cover the globe. This new project was renamed the International Geophysical Year (IGY). Antarctica was chosen as an area for particular attention because of its important influence on global weather. Throughout this period, politics were kept firmly in the background.</p>
                                        <p>The IGY took place in 1957-58 and it was during this period that the last great Antarctic journey was accomplished. Dr Vivian Fuchs' privately-funded Trans Antarctic Expedition finally achieved what the explorer Ernest Shackleton had first set out to do in 1914. Driving modified tractors, Fuchs' team traversed Antarctica from coast to coast in 99 days and covered 2,180 miles or roughly 3,500 kilometres. But there were scientific objectives as well, because the expedition's measurements allowed the first estimates to be made of the volume of ice that existed across the whole continent. So successful was the IGY that it was extended for a further year in order to promote Antarctic science. It also led directly to the signing of a treaty by members of the international community to regulate human conduct in Antarctica over the years ahead.</p>
                                    </div>
                                </div>
                            )}

                            {currentPart === 2 && (
                                <div>
                                    <h1 className="text-xl font-bold text-gray-900 mb-4 text-center">Effects of changes in world population</h1>
                                    <div className="space-y-4 text-sm text-gray-800 leading-relaxed">
                                        <p><strong>Section A:</strong> Human fertility rates around the world are dropping for a variety of complex reasons. While the population itself continues to increase, the rate of increase is slowing, and sometime in the next 80 years, world population will peak somewhere in the vicinity of nine billion before contracting. That raises an important question: is population contraction a bad thing? Some think not. There is a school of thought that argues that smaller populations are good. Population control proponents claim variously that (1) we do not have the food to sustain higher populations; (2) our planet already suffers from overcrowding; (3) the environmental impact of increased populations will bring catastrophe either through pollution or consumption of finite natural resources; or in contrast, they argue decreased populations will lead to higher wages and a better quality of life as available supplies exceed reduced demands. These arguments seem reasonable at first, but do not withstand scrutiny.</p>
                                        <p><strong>Section B:</strong> Let's start with food. The worry about mass starvation is a remnant of Paul Ehrlich's 1968 book The Population Bomb. Ehrlich, Professor of Population Studies in the department of Biological Sciences at Stanford University in California, wrote that in the face of expanding populations, 'the world will undergo famines - hundreds of millions of people are going to starve to death.' As Ehrlich himself now admits, this prediction proved faulty. Instead, the availability of food has greatly increased, even with a growing population. Demographer Philip Longman notes that food shortages have become 'a political problem, related to fair distribution, not an issue of inadequate supply'. How did this happen? In 1965, Danish economist Ester Boserup proposed that population increase fosters agricultural innovation, which in turn increases production. Her theories have been borne out by events, which show that some areas of the world may lack sufficient supplies while the world has an overall surplus.</p>
                                        <p><strong>Section C:</strong> What about overcrowding? Everywhere you go today, you find traffic jams and sprawl, with people packed into crowded places. But this is a problem of density, not population. There's plenty of land available out there. The problem is that people who used to live in the rural areas have relocated to cities. This massive migration into cities has caused urbanization, which is different from overpopulation, and the problems associated with this include air pollution, lower wages, and limited access to healthcare and educational opportunities.</p>
                                        <p><strong>Section D:</strong> Environmental concerns are more interesting, but such end-of-the-world warnings are not new. Global warming and the fact that the Earth has only finite amounts of natural resources that we will surely deplete, are the two main concerns of environmentalists. This, too, is an argument we have heard before. As Massimo Livi-Bacci, Professor of Demography at the University of Florence, Italy, explains in his Concise History of World Population, more than 100 years ago economists 'feared that coal supplies would be exhausted, and about 30 years ago the Club of Rome made similar predictions regarding other natural resources'. Instead, innovation stepped in to provide greater efficiency. For instance, in the America of 1850, you needed an average of 4.6 tons of petroleum equivalent to produce $1,000 of goods and services. By 1950, you needed only 1.8 tons, and by 1978, 1.5 tons.</p>
                                        <p><strong>Section E:</strong> This leaves us with the economy. In 1971, Simon Smith Kuznets won the Nobel Prize in Economics for his theory of 'tested knowledge'. Kuznets explained, 'More population means more creators and producers, both of goods along established production patterns and of new knowledge and inventions.' Kuznets was codifying what others had noticed before. Political economist Adam Smith remarked that 'the most decisive mark of the prosperity of any country is the increase of the number of its inhabitants.' As Livi-Bacci observes, 'All things being equal, population increase is followed by increased per capita production.' So the proposed 'benefits' of population decline are, at the very least, suspect. In addition, there are worrying potential costs of population decline. Of course, this worry is theoretical because we've never seen population decline on the massive scale that's coming our way. Or rather, we've never seen it in the modern world.</p>
                                        <p><strong>Section F:</strong> There are, however, two historical examples. Between 400 BC and AD 1, world population increased from about 153 million to 252 million. For the next 200 years, growth slowed almost to a halt. Then, between AD 200 and AD 600, the population shrank from 257 million to 208 million. It took an additional 400 years for the population to recover to the level it had attained in AD 1. The other drop in population occurred between 1340 and 1400, when the Black Death, one of the most deadly pandemics in human history, ravaged the world. Global population fell from 442 million to 375 million. Neither of these drops was a particularly pleasant period in human history. Or, as Canadian journalist Mark Steyn notes in America Alone, 'There is no precedent in human history for economic growth on declining human capital.' It is impossible to anticipate with certainty the effects of population decline. But there is good reason to believe it will be bad for us. Innovation will suffer as the demand for nearly everything slackens. Instead of producing windfalls of excess supply, economies will probably contract. As Livi-Bacci observes, 'Historically, areas depopulated or in the process of losing population have almost always been characterized by backward economies.' The real question therefore is whether or not falling populations will lead to the demise of civilization as we know it.</p>
                                    </div>
                                </div>
                            )}

                            {currentPart === 3 && (
                                <div>
                                    <h1 className="text-xl font-bold text-gray-900 mb-4 text-center">The lost animals of Australia</h1>
                                    <div className="space-y-4 text-sm text-gray-800 leading-relaxed">
                                        <p>The history of Australia's animals over the past 50,000 years has been largely one of extinction. The time has been too short for new species of large animals to evolve and, over this period, nearly one-third of Australia's mammal species have become extinct, along with nearly all the large reptiles and many of the flightless birds. The cause of these extinctions is still hotly debated. One school of thought suggests that humans caused the extinctions, and another that they were due to changes in climate. The greatest problem in evaluating these theories is that we do not know exactly when these animals became extinct. Fossils from a number of well-dated cave and lakeside sites suggest that all the now-extinct species had already vanished 35,000 years ago, but a few other sites suggest that giant marsupials might have survived until 25,000 years ago, or even as late as 6,000 years ago.</p>
                                        <p>One certainty is that Australia's climate has changed greatly over the past 40,000 years. Between 25,000 and 15,000 years ago, the sea level dropped by more than 100 metres and the continent experienced an extremely arid phase. Clearly, the timing of the extinctions is of critical importance. If they can be shown to coincide with the arrival of humans, about 50,000 years ago, then circumstantial evidence would point to humans as the cause. If, however, the giant marsupials survived until 25,000 years ago, the increased aridity would seem to be the more likely cause.</p>
                                        <p>Before these extinctions, Australia was a very different place. Naturally occurring fires were probably less frequent than they are now, because large marsupial herbivores (of which there were about forty species) reduced the standing crop of vegetation. Rainforest plants were widespread in the parts of Australia which are now very dry. The largest marsupial species was the diprotodon, which, like other Australian marsupial giants, was about one-third the weight of its ecological equivalent elsewhere. It probably weighed between 1,000 and 2,000 kilograms, while the elephant of Afro-Asia weighed about 5,000 kilograms. The relatively small size of the Australian marsupial giants has been attributed to Australia's extraordinarily poor soils and erratic climate, both factors which typically limit plant growth.</p>
                                        <p>Judging by the teeth of extinct species, there were many specialist grazers and browsers, paralleling the great mammal communities of Africa today. But the Australian carnivores were very different to their African equivalents. For example, the Australian marsupial lion was only about the size of a leopard; there was no equivalent of the large group of cat- and dog-like carnivores of Africa. The marsupial lion was Australia's only cat-like species; there was one dog-like species, the thylacine, which vanished from mainland Australia about 3,000 years ago, but seems to have survived on the Australian island of Tasmania until the 1930s, and one scavenger/carnivore, the Tasmanian devil. The larger Australian carnivores were all reptiles. The largest of these, the gigantic snakes of the genus Wonambi, were more than 8 metres long, and together with the 7-metre goanna and the 3-metre land crocodile, were the main predators. There were never vast numbers of most species. Large, warm-blooded creatures were at a disadvantage, their prey being limited by the nature of the soil and the climate. The cold-blooded reptilian carnivores, which required less energy, were therefore able to dominate.</p>
                                        <p>There is strong evidence to support the theory that humans were responsible for the decline of large animals in Australia. In their Afro-Eurasian homeland, humans were medium-sized members of a very large community of carnivores and omnivores. But by 40,000 years ago, they were taking a very broad range of prey, including mammals much larger than themselves. Studies have shown that when humans or other predators arrive in areas where there have previously been no ecologically equivalent species, they invariably have a profound impact. For example, over the past 1,000 years, Polynesians in Hawaii have destroyed more than 70% of the bird species, and, during the 1800s, hunters on islands close to Antarctica severely depleted many seal species.</p>
                                        <p>Australian animals were particularly vulnerable to the impact of humans. Marsupial herbivores were adapted only to avoiding predation by large but relatively unintelligent reptiles, while humans are the most efficient predators that have ever existed. From the mountain rainforests to the desert centre, extinctions emptied landscape after landscape, until finally the largest surviving mammals were humans themselves. Medium-sized animal species weighing between 10 and 100 kilograms either also became extinct or became smaller over thousands of years. Grey kangaroos are now only half the size they once were, while koalas and Tasmanian devils weigh, on average, one-third less than they once did.</p>
                                        <p>In general, in Australia, the larger the species, the more it has reduced in size, with the exception of humans and wombats; the latter may have been protected by their burrowing habits. This shrinking may also be attributable to human hunting practices. If hunters claimed the largest individuals of these species, fast-maturing small specimens would have been more likely to survive to maturity. Increasingly, they would have produced smaller offspring. Only the smallest mammals, those weighing less than 10 kilograms, survived unaltered, although some may have been restricted to a smaller number of areas. This extinction pattern changed with the arrival of Europeans towards the end of the 18th century. As a result of this, a large number of smaller species also became extinct over the course of the following century, together with 21 medium-sized mammals and one large mammal species.</p>
                                    </div>
                                </div>
                            )}
